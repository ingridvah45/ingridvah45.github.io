<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ussi Mäng</title>

<style>
    html, body {
        margin: 0;
        overflow: hidden;
        background: #ffe44d;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    .ui {
        position: fixed;
        top: 15px;
        left: 15px;
        color: #222;
        font-size: 24px;
        font-weight: bold;
        user-select: none;
        z-index: 10;
    }

    .gameover {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #222;
        display: none;
        user-select: none;
        z-index: 10;
    }

    .gameover h1 {
        font-size: 64px;
        margin: 0;
    }

    .gameover p {
        font-size: 24px;
    }

    .hint {
        position: fixed;
        bottom: 15px;
        width: 100%;
        text-align: center;
        color: #444;
        font-size: 16px;
        user-select: none;
        z-index: 10;
    }
</style>
</head>

<body>

<div class="ui">
    Õunad: <span id="score">0</span>
</div>

<div class="gameover" id="gameover">
    <h1>Mäng Läbi</h1>
    <p>Vajuta SPACE, et uuesti mängida</p>
</div>

<div class="hint">
    Liiguta hiirt, et juhtida ussi
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2
};

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

let worm;
let apple;
let obstacles;
let score;
let gameOver;

function pointInsideObstacle(x, y, obstacle, padding = 0) {
    return (
        x > obstacle.x - padding &&
        x < obstacle.x + obstacle.width + padding &&
        y > obstacle.y - padding &&
        y < obstacle.y + obstacle.height + padding
    );
}

function spawnApple() {

    let validPosition = false;
    let newApple;

    while (!validPosition) {

        newApple = {
            x: Math.random() * (canvas.width - 60) + 30,
            y: Math.random() * (canvas.height - 60) + 30,
            size: 14
        };

        validPosition = true;

        for (const obstacle of obstacles) {

            if (
                pointInsideObstacle(
                    newApple.x,
                    newApple.y,
                    obstacle,
                    25
                )
            ) {
                validPosition = false;
                break;
            }
        }
    }

    return newApple;
}

function createObstacles() {

    obstacles = [];

    for (let i = 0; i < 7; i++) {

        obstacles.push({
            x: Math.random() * (canvas.width - 250) + 80,
            y: Math.random() * (canvas.height - 250) + 80,
            width: 80 + Math.random() * 80,
            height: 40 + Math.random() * 100,

            // ÜLIAEGLANE liikumine
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15
        });
    }
}

function resetGame() {

    worm = {
        segments: [],
        speed: 0.12,
        size: 18
    };

    for (let i = 0; i < 20; i++) {
        worm.segments.push({
            x: canvas.width / 2,
            y: canvas.height / 2
        });
    }

    createObstacles();

    apple = spawnApple();

    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = score;
    document.getElementById("gameover").style.display = "none";
}

function moveObstacles() {

    for (const obstacle of obstacles) {

        obstacle.x += obstacle.vx;
        obstacle.y += obstacle.vy;

        // Põrkab ekraani servadelt tagasi
        if (
            obstacle.x <= 0 ||
            obstacle.x + obstacle.width >= canvas.width
        ) {
            obstacle.vx *= -1;
        }

        if (
            obstacle.y <= 0 ||
            obstacle.y + obstacle.height >= canvas.height
        ) {
            obstacle.vy *= -1;
        }
    }
}

function checkCollisionWithObstacle(x, y, radius, obstacle) {

    const closestX = Math.max(
        obstacle.x,
        Math.min(x, obstacle.x + obstacle.width)
    );

    const closestY = Math.max(
        obstacle.y,
        Math.min(y, obstacle.y + obstacle.height)
    );

    const dx = x - closestX;
    const dy = y - closestY;

    return (dx * dx + dy * dy) < radius * radius;
}

function update() {

    if (gameOver) return;

    moveObstacles();

    const head = worm.segments[0];

    // Liiguta pead hiire suunas
    head.x += (mouse.x - head.x) * worm.speed;
    head.y += (mouse.y - head.y) * worm.speed;

    // Ülejäänud keha järgneb
    for (let i = 1; i < worm.segments.length; i++) {

        const prev = worm.segments[i - 1];
        const seg = worm.segments[i];

        seg.x += (prev.x - seg.x) * 0.35;
        seg.y += (prev.y - seg.y) * 0.35;
    }

    // Õuna söömine
    const dx = head.x - apple.x;
    const dy = head.y - apple.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < worm.size + apple.size) {

        score++;
        document.getElementById("score").textContent = score;

        const tail = worm.segments[worm.segments.length - 1];

        worm.segments.push({
            x: tail.x,
            y: tail.y
        });

        apple = spawnApple();
    }

    // Kui pea läheb ekraanist välja
    if (
        head.x < 0 ||
        head.x > canvas.width ||
        head.y < 0 ||
        head.y > canvas.height
    ) {
        endGame();
    }

    // KÕIK ussi kehaosad võivad surra
    for (const segment of worm.segments) {

        for (const obstacle of obstacles) {

            if (
                checkCollisionWithObstacle(
                    segment.x,
                    segment.y,
                    worm.size,
                    obstacle
                )
            ) {
                endGame();
            }
        }
    }
}

function endGame() {

    gameOver = true;
    document.getElementById("gameover").style.display = "block";
}

window.addEventListener("keydown", (e) => {

    if (e.code === "Space" && gameOver) {
        resetGame();
    }
});

function drawApple() {

    ctx.fillStyle = "#e53935";

    ctx.beginPath();
    ctx.arc(apple.x, apple.y, apple.size, 0, Math.PI * 2);
    ctx.fill();

    // Läige
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.arc(apple.x - 4, apple.y - 4, 4, 0, Math.PI * 2);
    ctx.fill();

    // Vars
    ctx.strokeStyle = "#5d4037";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(apple.x, apple.y - apple.size + 2);
    ctx.lineTo(apple.x + 2, apple.y - apple.size - 8);
    ctx.stroke();

    // Leht
    ctx.fillStyle = "#43a047";

    ctx.beginPath();
    ctx.ellipse(
        apple.x + 7,
        apple.y - apple.size - 5,
        7,
        4,
        Math.PI / 4,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function drawObstacles() {

    for (const obstacle of obstacles) {

        // Vari
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(
            obstacle.x + 6,
            obstacle.y + 6,
            obstacle.width,
            obstacle.height
        );

        // Põhi
        ctx.fillStyle = "#555";

        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );

        // Highlight
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            6
        );
    }
}

function drawWorm() {

    for (let i = worm.segments.length - 1; i >= 0; i--) {

        const seg = worm.segments[i];
        const t = i / worm.segments.length;

        const green = Math.floor(180 - t * 90);

        ctx.fillStyle = `rgb(50, ${green}, 70)`;

        ctx.beginPath();

        ctx.arc(
            seg.x,
            seg.y,
            worm.size - t * 4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    // Silmad
    const head = worm.segments[0];

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(head.x - 5, head.y - 4, 4, 0, Math.PI * 2);
    ctx.arc(head.x + 5, head.y - 4, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(head.x - 5, head.y - 4, 2, 0, Math.PI * 2);
    ctx.arc(head.x + 5, head.y - 4, 2, 0, Math.PI * 2);
    ctx.fill();
}

function drawBackground() {

    ctx.fillStyle = "#ffe44d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dekoratiivsed ringid
    for (let i = 0; i < 40; i++) {

        ctx.fillStyle = "rgba(255,255,255,0.08)";

        ctx.beginPath();

        ctx.arc(
            (i * 173) % canvas.width,
            (i * 97) % canvas.height,
            30,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function render() {

    drawBackground();
    drawObstacles();
    drawApple();
    drawWorm();
}

function gameLoop() {

    update();
    render();

    requestAnimationFrame(gameLoop);
}

resetGame();
gameLoop();
</script>

</body>
</html>
