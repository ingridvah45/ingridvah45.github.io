<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Winx Phone</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
min-height:100vh;
background:radial-gradient(ellipse at 25% 15%,#ff80cc 0%,#ff40a8 30%,#cc1880 65%,#880050 100%);
display:flex;align-items:center;justify-content:center;
overflow:hidden;position:relative;
}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{
position:absolute;
animation:twinkle var(--dur,2s) ease-in-out infinite var(--delay,0s);
opacity:0;font-size:var(--sz,10px);color:var(--c,#ffb3dc);
filter:drop-shadow(0 0 4px var(--c,#ffb3dc));
}
@keyframes twinkle{
0%,100%{opacity:0;transform:scale(.3);}
50%{opacity:1;transform:scale(1.2);}
}

#phone-wrap{
position:relative;z-index:2;width:700px;flex-shrink:0;
filter:drop-shadow(0 0 50px rgba(255,100,180,.7)) drop-shadow(0 30px 60px rgba(140,0,80,.55));
}
#phone-svg{width:100%;height:auto;overflow:visible;}

#_x3C_background_x3E_{fill:url(#bodyGrad);stroke:none;}

#phone_screen{fill:url(#screenGrad);stroke:rgba(255,180,220,.6);stroke-width:.8;}

.inner-lines{
fill:none;stroke:rgba(255,140,200,.35);stroke-width:1.8;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;filter:url(#softLine);
}

#phone_decoration{
fill:none;stroke:rgba(255,140,200,.35);stroke-width:1.8;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;filter:url(#softLine);
}

.body-border{
fill:none;stroke:rgba(255,160,210,.4);stroke-width:1;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;filter:url(#softLine);
}

.dpad-inner{
fill:none;stroke:rgba(255,140,200,.38);stroke-width:1.8;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;filter:url(#softLine);
}

.dpad-tab{
fill:url(#wingBtnGrad);stroke:rgba(255,160,210,.3);stroke-width:.6;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;
}

#up_arrow,#down_arrow,#left_arrow,#right_arrow{
fill:none;stroke:#ff2090;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;
filter:drop-shadow(0 0 3px rgba(255,30,140,.9));
cursor:pointer;
}
#up_arrow:hover,#down_arrow:hover,#left_arrow:hover,#right_arrow:hover{
stroke:#ffffff;
}

#left_wing_button,#right_wing_button{
fill:url(#wingBtnGrad);stroke:#ff50a0;stroke-width:1.4;
stroke-linecap:round;stroke-linejoin:round;
cursor:pointer;transition:filter .15s;filter:url(#btnGlow);
}
#left_wing_button:hover,#right_wing_button:hover{filter:url(#btnGlowHot);}
#left_wing_button.toggled,#right_wing_button.toggled{fill:url(#wingBtnBlue);filter:url(#btnGlowBlue);}

.st2{
fill:url(#bubbleGrad);stroke:rgba(140,210,255,.8);stroke-width:.8;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;
cursor:pointer;transition:filter .12s;filter:url(#bubbleGlow);
}
.st2:hover{filter:url(#bubbleGlowHot);}
.st2:active{filter:brightness(.85);}

.numLabel{
font-family:'VT323',monospace;font-size:14px;fill:white;
text-anchor:middle;dominant-baseline:middle;
pointer-events:none;filter:url(#chromeFlt);
}

#lwg{
transform-box:fill-box;transform-origin:right center;
transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
opacity:0;transform:scaleX(0);
}
#rwg{
transform-box:fill-box;transform-origin:left center;
transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
opacity:0;transform:scaleX(0);
}
#lwg.active,#rwg.active{opacity:1;transform:scaleX(1);}

/* screen overlay — sits on top of the SVG screen rect */
#screen-content{
position:absolute;
left:290px;top:285px;width:120px;height:128px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
pointer-events:none;z-index:5;overflow:hidden;gap:2px;
}
/* idle text lines */
#screen-line1,#screen-line2,#screen-line3{
font-family:'VT323',monospace;text-align:center;line-height:1.15;max-width:100%;
background:linear-gradient(180deg,#fff 0%,#c8e0ff 25%,#7090c8 50%,#c8deff 75%,#fff 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(0 1px 3px rgba(100,180,255,.9));
}
#screen-line1{font-size:16px;letter-spacing:1px;}
#screen-line2{font-size:12px;}
#screen-line3{font-size:10px;letter-spacing:.5px;}

/* snake canvas sits inside screen overlay, hidden by default */
#snake-canvas{
display:none;
position:absolute;top:0;left:0;
width:120px;height:128px;
image-rendering:pixelated;
}

/* score display inside screen when game is active */
#snake-score{
display:none;
position:absolute;top:2px;right:5px;
font-family:'VT323',monospace;font-size:11px;
color:#ff80cc;
filter:drop-shadow(0 0 3px #ff40a0);
z-index:6;
pointer-events:none;
}

/* game-over overlay inside screen */
#snake-over{
display:none;
position:absolute;top:0;left:0;width:120px;height:128px;
flex-direction:column;align-items:center;justify-content:center;
background:rgba(5,0,15,.85);gap:2px;z-index:7;
pointer-events:none;
}
#snake-over span{
font-family:'VT323',monospace;text-align:center;
background:linear-gradient(180deg,#fff 0%,#ffaadd 50%,#fff 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#snake-over .over-title{font-size:14px;letter-spacing:1px;}
#snake-over .over-score{font-size:11px;}
#snake-over .over-hint{font-size:9px;color:#ff80cc;-webkit-text-fill-color:#ff80cc;}

.ripple{
position:fixed;border-radius:50%;pointer-events:none;z-index:999;
animation:rippleOut .6s ease-out forwards;
background:radial-gradient(circle,rgba(255,220,240,.9) 0%,rgba(255,160,220,.4) 60%,transparent 100%);
}
@keyframes rippleOut{from{transform:scale(0);opacity:1;}to{transform:scale(5);opacity:0;}}

.fburst{position:fixed;pointer-events:none;z-index:998;animation:fburstAnim .85s ease-out forwards;}
@keyframes fburstAnim{
0%{opacity:1;transform:translate(0,0) scale(.5);}
100%{opacity:0;transform:translate(var(--tx,0px),var(--ty,-55px)) scale(1.5) rotate(35deg);}
}

.gspark{
position:fixed;pointer-events:none;z-index:997;border-radius:50%;
animation:gsparkAnim var(--gd,.9s) ease-out forwards;
}
@keyframes gsparkAnim{
0%{opacity:1;transform:translate(0,0) scale(1);}
100%{opacity:0;transform:translate(var(--gx,0px),var(--gy,30px)) scale(0);}
}

/* hint text below phone */
#hint{
position:relative;z-index:3;
margin-top:16px;
font-family:'VT323',monospace;
font-size:18px;
color:rgba(255,220,240,.75);
letter-spacing:2px;
text-shadow:0 0 12px rgba(255,100,180,.6);
text-align:center;
pointer-events:none;
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div style="display:flex;flex-direction:column;align-items:center;">
<div id="phone-wrap">
  <div id="screen-content">
    <!-- idle screen text -->
    <div id="screen-line1">✦ WINX ✦</div>
    <div id="screen-line2">CLUB</div>
    <div id="screen-line3">· ready ·</div>
    <!-- snake canvas -->
    <canvas id="snake-canvas" width="120" height="128"></canvas>
    <!-- score -->
    <div id="snake-score">★0</div>
    <!-- game over -->
    <div id="snake-over">
      <span class="over-title">GAME OVER</span>
      <span class="over-score" id="over-score-txt">★ 0</span>
      <span class="over-hint">press 0 to retry</span>
    </div>
  </div>

  <svg id="phone-svg" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>

  <linearGradient id="bodyGrad" x1="5%" y1="0%" x2="95%" y2="100%">
  <stop offset="0%" stop-color="#fff5fb"/>

  <stop offset="20%" stop-color="#ffcce8"/>

  <stop offset="55%" stop-color="#ff66bb"/>
  <stop offset="72%" stop-color="#e83898"/>
  <stop offset="88%" stop-color="#c01870"/>
  <stop offset="100%" stop-color="#960050"/>
  </linearGradient>

  <radialGradient id="specGrad" cx="28%" cy="18%" r="45%">
  <stop offset="0%" stop-color="white" stop-opacity=".55"/>
  <stop offset="40%" stop-color="white" stop-opacity=".18"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="rimGrad" cx="80%" cy="88%" r="40%">
  <stop offset="0%" stop-color="#ffd0f0" stop-opacity=".35"/>
  <stop offset="100%" stop-color="#ffd0f0" stop-opacity="0"/>

  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">

  <linearGradient id="wingFill" x1="0%" y1="0%" x2="70%" y2="100%">

  <linearGradient id="wingBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">

  <linearGradient id="wingBtnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#e4f8ff"/>
  <stop offset="50%" stop-color="#80d8ff"/>
  <stop offset="100%" stop-color="#40a8e0"/>
  </linearGradient>

  <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="rgba(220,244,255,.88)"/>
  <stop offset="40%" stop-color="rgba(150,210,255,.72)"/>
  <stop offset="100%" stop-color="rgba(100,185,255,.80)"/>
  </linearGradient>

  <pattern id="glitter" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="none"/>

  <filter id="bevel" x="-14%" y="-14%" width="128%" height="128%">

  <feBlend in="SourceGraphic" in2="bright" mode="screen"/>
  </filter>

  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="btnGlowHot" x="-40%" y="-40%" width="180%" height="180%">

  <feColorMatrix in="blur" type="matrix" values="1.4 0 .4 0 0 0 .2 .8 0 0 .4 0 1.2 0 0 0 0 0 1.8 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="btnGlowBlue" x="-40%" y="-40%" width="180%" height="180%">

  <feGaussianBlur in="SourceAlpha" stdDeviation=".6" result="blur"/>

<script>
// ══════════════════════════════════════
// STARS
// ══════════════════════════════════════
(function(){
  const c=document.getElementById('stars');
  const p=['#ff70b8','#ff98cc','#ffbcdc','#ffdcf4','#ffffff','#f8b4ff','#c4e8ff'];
  const ch=['✦','✧','★','✺','·'];
  for(let i=0;i<75;i++){
    const s=document.createElement('div');s.className='star';
    s.textContent=ch[Math.floor(Math.random()*ch.length)];
    s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;`
      +`--sz:${(Math.random()*13+5)}px;--c:${p[Math.floor(Math.random()*p.length)]};`
      +`--dur:${(Math.random()*3+1.2).toFixed(1)}s;--delay:-${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
})();

// ══════════════════════════════════════
// SNAKE GAME
// ══════════════════════════════════════
const COLS = 20;
const ROWS = 21;  // 120/6 = 20, 128/6 ≈ 21
const CELL = 6;   // pixels per cell on the 120×128 canvas
const canvas   = document.getElementById('snake-canvas');
const ctx      = canvas.getContext('2d');
const scoreEl  = document.getElementById('snake-score');
const overEl   = document.getElementById('snake-over');
const overScoreTxt = document.getElementById('over-score-txt');
const line1    = document.getElementById('screen-line1');
const line2    = document.getElementById('screen-line2');
const line3    = document.getElementById('screen-line3');
const hint     = document.getElementById('hint');

let snake, dir, nextDir, food, score, gameLoop, gameState;
// gameState: 'idle' | 'running' | 'over'

function initGame(){
  snake = [{x:10, y:10},{x:9,y:10},{x:8,y:10}];
  dir      = {x:1, y:0};
  nextDir  = {x:1, y:0};
  food     = spawnFood();
  score    = 0;
  gameState = 'running';

  // show canvas, hide idle text and game-over
  line1.style.display = 'none';
  line2.style.display = 'none';
  line3.style.display = 'none';
  overEl.style.display = 'none';
  canvas.style.display = 'block';
  scoreEl.style.display = 'block';
  scoreEl.textContent = '★' + score;
  hint.style.display = 'none';

  clearInterval(gameLoop);
  gameLoop = setInterval(tick, 150);
}

function spawnFood(){
  let f;
  do {
    f = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while(snake.some(s=>s.x===f.x && s.y===f.y));
  return f;
}

function tick(){
  // apply direction
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // wall collision
  if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
    endGame(); return;
  }
  // self collision
  if(snake.some(s=>s.x===head.x && s.y===head.y)){
    endGame(); return;
  }

  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){
    score++;
    scoreEl.textContent = '★' + score;
    food = spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw(){
  // clear — deep dark background
  ctx.fillStyle = '#080010';
  ctx.fillRect(0, 0, 120, 128);

  // food — pink circle
  ctx.fillStyle = '#ff70c0';
  ctx.shadowColor = '#ff40a0';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake — blue segments
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    ctx.fillStyle = isHead ? '#00d8ff' : '#0090d0';
    ctx.shadowColor = isHead ? '#00d8ff' : 'transparent';
    ctx.shadowBlur  = isHead ? 5 : 0;
    const pad = isHead ? 0 : 0.5;
    ctx.fillRect(seg.x*CELL + pad, seg.y*CELL + pad, CELL - pad*2, CELL - pad*2);
  });
  ctx.shadowBlur = 0;
}

function endGame(){
  clearInterval(gameLoop);
  gameState = 'over';
  canvas.style.display = 'none';
  scoreEl.style.display = 'none';
  overScoreTxt.textContent = '★ ' + score;
  overEl.style.display = 'flex';
  hint.style.display = 'block';
  hint.textContent = '✦ press 0 to play again ✦';
}

function setDir(dx, dy){
  // prevent reversing
  if(dx === -dir.x && dy === -dir.y) return;
  nextDir = {x:dx, y:dy};
}

// ══════════════════════════════════════
// WING BUTTONS
// ══════════════════════════════════════
const lwg = document.getElementById('lwg');
const rwg = document.getElementById('rwg');
const lwb = document.getElementById('left_wing_button');
const rwb = document.getElementById('right_wing_button');
let leftOn=false, rightOn=false;

// ══════════════════════════════════════
// EFFECTS
// ══════════════════════════════════════
function fairyBurst(x,y){
  const ch=['✦','✧','★','✺','·'];
  const col=['#ff70b8','#ffaadd','#c4e8ff','#ffdcf4','#f8b4ff','#88d4ff'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='fburst';
    el.textContent=ch[Math.floor(Math.random()*ch.length)];
    const ang=Math.random()*Math.PI*2,d=28+Math.random()*55;
    el.style.cssText=`left:${x}px;top:${y}px;color:${col[Math.floor(Math.random()*col.length)]};`
      +`font-size:${9+Math.random()*14}px;--tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d-48}px;`
      +`animation-delay:${Math.random()*.14}s;filter:drop-shadow(0 0 5px currentColor);`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
function ripple(x,y){
  const r=document.createElement('div');r.className='ripple';const s=65;
  r.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;`;
  document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
}
function center(el){const rc=el.getBoundingClientRect();return[rc.left+rc.width/2,rc.top+rc.height/2];}

// ══════════════════════════════════════
// IDLE SCREEN — shown when not playing
// ══════════════════════════════════════
const msgs = {
  '1':[['✦ BLOOM ✦','fairy of fire','winx s01 ♡'],['✦ MISS U ✦','call me pls!','xoxo bloom'],['★ POWER ★','believix!','go winx!!']],
  '2':[['✧ STELLA ✧','fashion queen','sun fairy'],  ['♡ GLAM ♡','new outfit!','fabulous~'],  ['★ SHINE ★','solaria pwr','dazzle!!']],
  '3':[['✦ AISHA ✦','fairy of waves','ocean ♡♡'],   ['✧ DANCE ✧','groove time!','feel it~'],  ['★ MORPH ★','morphix pwr','splash!!']],
  '4':[['✦ FLORA ✦','nature fairy','garden ♡'],     ['✧ BLOOM ✧','new flower!','growing~'],   ['★ PETAL ★','charmix!','blossom!!']],
  '5':[['✦ MUSA ✦','music fairy','melody ♡'],       ['✧ SONG ✧','new ringtone','download~'],  ['★ BEAT ★','harmonic!','play it!!']],
  '6':[['✦ TECNA ✦','tech fairy','wifi full ♡'],    ['✧ CYBER ✧','connected!','online~'],     ['★ POWER ★','technomagic','loading!!']],
  '7':[['✧ ALFEA ✧','school day','late 4 class'],   ['✦ NITE ✦','sweet dreamz','nite nite~'], ['★ MAGIC ★','study time','fairies!!']],
  '8':[['✦ SPELL ✦','new power!','unlocked ♡'],     ['✧ GLITTER✧','sparkle pwr','shimmer~'],  ['★ WINX ★','transform!','magic!!']],
  '9':[['✦ ENCHIX✦','fairy queen','royalty ♡'],     ['✧ DREAM ✧','fairy world','believe~'],   ['★ RAINBOW★','colour pwr','fly!!']],
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function showIdleMsg(key){
  if(gameState==='running') return;
  const pool = msgs[key];
  if(!pool) return;
  const[a,b,c] = pick(pool);
  line1.textContent=a; line2.textContent=b; line3.textContent=c;
}

function showIdleScreen(){
  canvas.style.display='none';
  scoreEl.style.display='none';
  overEl.style.display='none';
  line1.style.display='';
  line2.style.display='';
  line3.style.display='';
  line1.textContent='✦ WINX ✦';
  line2.textContent='CLUB';
  line3.textContent='· ready ·';
}

// init state
gameState = 'idle';
showIdleScreen();

// ══════════════════════════════════════
// BUTTON CLICKS
// ══════════════════════════════════════

// Numpad buttons
document.querySelectorAll('.numpad-btn').forEach(el=>{
  el.addEventListener('click', e=>{
    const key = e.currentTarget.dataset.key;
    const[cx,cy] = center(e.currentTarget);
    ripple(cx,cy); fairyBurst(cx,cy);

    if(key === '0'){
      initGame();
    } else {
      showIdleMsg(key);
    }
  });
});

// Arrow buttons — control snake
document.getElementById('up_arrow').addEventListener('click', ()=>{
  if(gameState==='running') setDir(0,-1);
});
document.getElementById('down_arrow').addEventListener('click', ()=>{
  if(gameState==='running') setDir(0,1);
});
document.getElementById('left_arrow').addEventListener('click', ()=>{
  if(gameState==='running') setDir(-1,0);
});
document.getElementById('right_arrow').addEventListener('click', ()=>{
  if(gameState==='running') setDir(1,0);
});

// Wing buttons
lwb.addEventListener('click',()=>{
  leftOn=!leftOn;
  lwg.classList.toggle('active',leftOn);
  lwb.classList.toggle('toggled',leftOn);
  const[cx,cy]=center(lwb); ripple(cx,cy); fairyBurst(cx,cy);
  if(gameState!=='running'){
    line1.textContent='✦ WINGS ✦';
    line2.textContent=leftOn?'left open':'left closed';
    line3.textContent='· magic ·';
  }
});
rwb.addEventListener('click',()=>{
  rightOn=!rightOn;
  rwg.classList.toggle('active',rightOn);
  rwb.classList.toggle('toggled',rightOn);
  const[cx,cy]=center(rwb); ripple(cx,cy); fairyBurst(cx,cy);
  if(gameState!=='running'){
    line1.textContent='✦ WINGS ✦';
    line2.textContent=rightOn?'right open':'right closed';
    line3.textContent='· magic ·';
  }
});

// Keyboard arrows also work
document.addEventListener('keydown', e=>{
  if(gameState!=='running') return;
  if(e.key==='ArrowUp')    { e.preventDefault(); setDir(0,-1); }
  if(e.key==='ArrowDown')  { e.preventDefault(); setDir(0,1);  }
  if(e.key==='ArrowLeft')  { e.preventDefault(); setDir(-1,0); }
  if(e.key==='ArrowRight') { e.preventDefault(); setDir(1,0);  }
});

// Touch support for wing buttons
[lwb,rwb].forEach(b=>{
  b.addEventListener('touchstart',e=>{e.preventDefault();b.dispatchEvent(new MouseEvent('click'));},{passive:false});
});

// ══════════════════════════════════════
// GLITTER SPILL ON MOUSEMOVE
// ══════════════════════════════════════
const phoneSvg = document.getElementById('phone-svg');
const glitterColors=['#ffffff','#ffd6f4','#ffb3e6','#ffc8ff','#d4b0ff','#b8d8ff','#ffe0ff','#fff0b8'];
let lastGlitterTime=0;
phoneSvg.addEventListener('mousemove',e=>{
  const now=Date.now();
  if(now-lastGlitterTime<40) return;
  lastGlitterTime=now;
  const rect=phoneSvg.getBoundingClientRect();
  const mx=e.clientX,my=e.clientY;
  const relX=(mx-rect.left)/rect.width;
  const relY=(my-rect.top)/rect.height;
  if(relX<0.27||relX>0.73||relY<0.14||relY>0.95) return;
  const count=2+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const spark=document.createElement('div');
    spark.className='gspark';
    const sz=3+Math.random()*6;
    const col=glitterColors[Math.floor(Math.random()*glitterColors.length)];
    const ang=Math.random()*Math.PI*2;
    const dist=15+Math.random()*40;
    const dur=(.5+Math.random()*.6).toFixed(2);
    spark.style.cssText=`left:${mx}px;top:${my}px;width:${sz}px;height:${sz}px;`
      +`background:${col};box-shadow:0 0 ${sz*1.5}px ${col};`
      +`--gx:${(Math.cos(ang)*dist).toFixed(1)}px;--gy:${(Math.sin(ang)*dist+10).toFixed(1)}px;`
      +`--gd:${dur}s;animation-delay:${(Math.random()*.08).toFixed(2)}s;`;
    document.body.appendChild(spark);
    spark.addEventListener('animationend',()=>spark.remove());
  }
});
</script>
</body>
</html>
