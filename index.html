    position:absolute;

    50%{opacity:1;transform:scale(1.3) rotate(20deg);}

  #phone-wrap{
    position:relative;z-index:2;
    width:520px;          /* was 360px – now 520px */
    flex-shrink:0;

      drop-shadow(0 0 40px rgba(255,80,160,.7))
      drop-shadow(0 30px 60px rgba(180,0,100,.5));
  }

  #phone-svg{width:100%;height:auto;overflow:visible;}

  /* ── phone body ── */
  #_x3C_background_x3E_{
    fill:url(#bodyGrad);
    stroke:url(#bodyStroke);
    stroke-width:2;
    filter:url(#bevel);
  }

  /* glitter overlay on body */
  #body-glitter{pointer-events:none;}

  #phone_screen{
    fill:url(#screenGrad);

  #left_wing,#right_wing{

  #left_wing.active  {opacity:1;transform:scale(1);}

  #left_wing_button,#right_wing_button{

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function setScreen(key){
  const pool=keyContent[key]||[['✦','WINX','magic!']];
  const [e,l1,l2]=pick(pool);
  sEmoji.textContent=e;
  sTxt.textContent=l1;
  sSub.textContent=l2||'';
}

function fairyBurst(x,y){
  const ch=['✦','✧','★','♡','✺','🌸','🦋'];
  const col=['#ff60b0','#ffaadd','#c0e8ff','#ffd6f0','#f8b0ff','#80d0ff'];
  for(let i=0;i<12;i++){
    const el=document.createElement('div');
    el.className='fairy-burst';
    el.textContent=ch[Math.floor(Math.random()*ch.length)];
    const ang=(Math.random()*360)*Math.PI/180;
    const d=30+Math.random()*60;
    el.style.cssText=`left:${x}px;top:${y}px;color:${col[Math.floor(Math.random()*col.length)]};
      font-size:${10+Math.random()*16}px;
      --tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d-50}px;
      animation-delay:${Math.random()*.15}s;
      filter:drop-shadow(0 0 5px currentColor);`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

function spawnRipple(x,y){
  const r=document.createElement('div');
  r.className='ripple';
  const sz=70;
  r.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;`;
  document.body.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
}

function getBtnCenter(el){
  const rect=el.getBoundingClientRect();
  return [rect.left+rect.width/2, rect.top+rect.height/2];
}

// left wing toggle
lwb.addEventListener('click',()=>{
  leftOn=!leftOn;
  lwg.style.opacity=leftOn?'1':'0';
  lwg.style.transform=leftOn?'scale(1)':'scale(0)';
  lwb.classList.toggle('toggled',leftOn);
  const [cx,cy]=getBtnCenter(lwb);
  spawnRipple(cx,cy); fairyBurst(cx,cy);
  if(leftOn){sEmoji.textContent='🦋';sTxt.textContent='LEFT WING';sSub.textContent='✦ spread ✦';}
  else{sEmoji.textContent='🌸';sTxt.textContent='WINX CLUB';sSub.textContent='✦ ready ✦';}
});

// right wing toggle
rwb.addEventListener('click',()=>{
  rightOn=!rightOn;
  rwg.style.opacity=rightOn?'1':'0';
  rwg.style.transform=rightOn?'scale(1)':'scale(0)';
  rwb.classList.toggle('toggled',rightOn);
  const [cx,cy]=getBtnCenter(rwb);
  spawnRipple(cx,cy); fairyBurst(cx,cy);
  if(rightOn){sEmoji.textContent='🦋';sTxt.textContent='RIGHT WING';sSub.textContent='✦ fly ✦';}
  else{sEmoji.textContent='🌸';sTxt.textContent='WINX CLUB';sSub.textContent='✦ ready ✦';}
});

// numpad
document.querySelectorAll('.numpad-btn').forEach(el=>{
  el.addEventListener('click',e=>{
    const [cx,cy]=getBtnCenter(e.currentTarget);
    spawnRipple(cx,cy); fairyBurst(cx,cy);
    setScreen(e.currentTarget.dataset.key);
  });
});

// touch
[lwb,rwb].forEach(btn=>{
  btn.addEventListener('touchstart',e=>{
    e.preventDefault();
    btn.dispatchEvent(new MouseEvent('click'));
  },{passive:false});
});
