<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fairy Phone</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#ffb6f3 0%,#c986ff 35%,#7d6bff 65%,#2d2259 100%);
  position:relative;
  font-family:'VT323', monospace;
}

/* BACKGROUND GLITTER */

.sparkle-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.spark{
  position:absolute;
  color:white;
  opacity:.8;
  animation:twinkle linear infinite;
  text-shadow:
    0 0 6px white,
    0 0 12px #ff9ae7,
    0 0 20px #9ae4ff;
}

@keyframes twinkle{
  0%{
    transform:scale(.4) rotate(0deg);
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:scale(1.4) rotate(80deg);
    opacity:0;
  }
}

/* PHONE */

#phone-wrap{
  width:650px;
  position:relative;
  z-index:5;
  filter:
    drop-shadow(0 0 20px #ff7bd5)
    drop-shadow(0 0 60px #ff7bd5)
    drop-shadow(0 0 100px rgba(255,255,255,.25));
}

/* WINGS */

.wing{
  position:absolute;
  width:330px;
  top:40px;
  opacity:0;
  transition:.7s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
  filter:
    drop-shadow(0 0 15px #fff)
    drop-shadow(0 0 35px #ff9ef0);
}

#leftWing{
  left:-240px;
  transform:translateX(100px) scale(.4);
}

#rightWing{
  right:-240px;
  transform:translateX(-100px) scale(.4);
}

#leftWing.active{
  opacity:1;
  transform:translateX(0px) scale(1);
}

#rightWing.active{
  opacity:1;
  transform:translateX(0px) scale(1);
}

/* PHONE BODY */

.phone{
  width:100%;
  position:relative;
}

.phone svg{
  width:100%;
  height:auto;
}

/* SCREEN */

.screen{
  position:absolute;
  left:50%;
  top:155px;
  transform:translateX(-50%);
  width:200px;
  height:220px;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(180deg,#ffb6f3 0%,#db83ff 50%,#83d6ff 100%);
  border:4px solid rgba(255,255,255,.65);
  box-shadow:
    inset 0 0 30px rgba(255,255,255,.4),
    0 0 25px rgba(255,255,255,.4);
}

.screen::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.5) 0%,
      transparent 30%
    );
  pointer-events:none;
}

.screen-content{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  overflow:hidden;
}

.screenText{
  font-size:30px;
  line-height:1.1;
  letter-spacing:2px;
  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #f7dfff 20%,
    #9ce5ff 50%,
    #ffffff 80%
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 20px #ff8ae2,
    0 0 25px #8fdcff;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.4));
}

/* SCREEN IMAGE */

.screen-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTTONS */

.phone-btn{
  cursor:pointer;
  transition:.15s;
}

.phone-btn:hover{
  filter:brightness(1.15);
}

.phone-btn:active{
  transform:scale(.97);
}

/* NUMBER BUTTONS */

.num-btn{
  fill:url(#blueBubble);
  stroke:#ffffff;
  stroke-opacity:.8;
  stroke-width:1.2;
}

.num-text{
  fill:white;
  font-size:24px;
  font-family:'Orbitron', sans-serif;
  pointer-events:none;
  text-shadow:0 0 10px white;
}

/* WING BUTTONS */

.wing-btn{
  fill:url(#wingBlue);
  stroke:#ffffff;
  stroke-width:1.4;
  transition:.2s;
}

.wing-btn.active{
  fill:url(#wingBlueActive);
}

/* RIPPLE */

.ripple{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  animation:ripple .7s forwards;
  z-index:999;
  background:
    radial-gradient(circle,
    rgba(255,255,255,.8),
    rgba(155,228,255,.4),
    transparent);
}

@keyframes ripple{
  from{
    transform:scale(0);
    opacity:1;
  }
  to{
    transform:scale(5);
    opacity:0;
  }
}

/* FLOATING FAIRY DUST */

.dust{
  position:fixed;
  pointer-events:none;
  z-index:999;
  animation:dustAnim 1s forwards;
  color:white;
  text-shadow:
    0 0 8px white,
    0 0 15px #ff9ce9;
}

@keyframes dustAnim{
  from{
    opacity:1;
    transform:translate(0,0) scale(.5);
  }
  to{
    opacity:0;
    transform:
      translate(var(--x),var(--y))
      scale(1.5)
      rotate(120deg);
  }
}

</style>
</head>

<body>

<div class="sparkle-layer" id="sparkles"></div>

<div id="phone-wrap">

  <!-- WINGS -->

  <img
    src="https://pngimg.com/d/butterfly_PNG1046.png"
    class="wing"
    id="leftWing"
    style="transform-origin:right center;"
  >

  <img
    src="https://pngimg.com/d/butterfly_PNG1046.png"
    class="wing"
    id="rightWing"
    style="
      transform-origin:left center;
      transform:scaleX(-1) translateX(-100px) scale(.4);
    "
  >

  <!-- PHONE -->

  <div class="phone">

<svg viewBox="0 0 700 1200">

<defs>

<linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffb8ef"/>
  <stop offset="30%" stop-color="#ff72d8"/>
  <stop offset="65%" stop-color="#ff8be8"/>
  <stop offset="100%" stop-color="#8cd9ff"/>
</linearGradient>

<linearGradient id="blueBubble" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="rgba(255,255,255,.95)"/>
  <stop offset="20%" stop-color="#bfefff"/>
  <stop offset="55%" stop-color="#79cfff"/>
  <stop offset="100%" stop-color="#9de5ff"/>
</linearGradient>

<linearGradient id="wingBlue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#dff9ff"/>
  <stop offset="100%" stop-color="#73d7ff"/>
</linearGradient>

<linearGradient id="wingBlueActive" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#4ed3ff"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="6" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- PHONE BODY -->

<rect
x="140"
y="40"
rx="100"
ry="100"
width="420"
height="1080"
fill="url(#phoneBody)"
stroke="rgba(255,255,255,.9)"
stroke-width="8"
/>

<!-- GLITTER -->

<circle cx="200" cy="100" r="5" fill="white"/>
<circle cx="320" cy="160" r="4" fill="white"/>
<circle cx="470" cy="120" r="6" fill="white"/>
<circle cx="400" cy="300" r="4" fill="white"/>
<circle cx="230" cy="520" r="5" fill="white"/>
<circle cx="480" cy="670" r="5" fill="white"/>
<circle cx="290" cy="940" r="4" fill="white"/>

<!-- WING BUTTONS -->

<path
id="leftWingBtn"
class="phone-btn wing-btn"
d="M250 505
Q210 470 180 520
Q220 570 260 540
Z"
/>

<path
id="rightWingBtn"
class="phone-btn wing-btn"
d="M450 505
Q490 470 520 520
Q480 570 440 540
Z"
/>

<!-- CENTER GEM -->

<path
d="M350 500
Q300 530 350 610
Q400 530 350 500Z"
fill="url(#phoneBody)"
stroke="white"
stroke-width="6"
/>

<!-- NUMBER BUTTONS -->

<ellipse class="phone-btn num-btn" data-key="1" cx="245" cy="710" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="2" cx="350" cy="710" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="3" cx="455" cy="710" rx="52" ry="28"/>

<ellipse class="phone-btn num-btn" data-key="4" cx="245" cy="805" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="5" cx="350" cy="805" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="6" cx="455" cy="805" rx="52" ry="28"/>

<ellipse class="phone-btn num-btn" data-key="7" cx="245" cy="900" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="8" cx="350" cy="900" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="9" cx="455" cy="900" rx="52" ry="28"/>

<ellipse class="phone-btn num-btn" data-key="*" cx="245" cy="995" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="0" cx="350" cy="995" rx="52" ry="28"/>
<ellipse class="phone-btn num-btn" data-key="#" cx="455" cy="995" rx="52" ry="28"/>

<!-- NUMBERS -->

<text class="num-text" x="235" y="720">1</text>
<text class="num-text" x="340" y="720">2</text>
<text class="num-text" x="445" y="720">3</text>

<text class="num-text" x="235" y="815">4</text>
<text class="num-text" x="340" y="815">5</text>
<text class="num-text" x="445" y="815">6</text>

<text class="num-text" x="235" y="910">7</text>
<text class="num-text" x="340" y="910">8</text>
<text class="num-text" x="445" y="910">9</text>

<text class="num-text" x="230" y="1005">*</text>
<text class="num-text" x="340" y="1005">0</text>
<text class="num-text" x="448" y="1005">#</text>

</svg>

<!-- SCREEN -->

<div class="screen">

<div class="screen-content" id="screenContent">

<div class="screenText" id="screenText">
MAGIC<br>CALL
</div>

</div>

</div>

</div>

</div>

<script>

/* SPARKLES */

const sparkleLayer = document.getElementById('sparkles');

for(let i=0;i<120;i++){

  const s=document.createElement('div');

  s.className='spark';

  s.innerHTML=['✦','✧','★','♡'][Math.floor(Math.random()*4)];

  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';

  s.style.fontSize=(Math.random()*18+8)+'px';

  s.style.animationDuration=(Math.random()*5+2)+'s';
  s.style.animationDelay=(-Math.random()*5)+'s';

  sparkleLayer.appendChild(s);
}

/* WINGS */

const leftWing=document.getElementById('leftWing');
const rightWing=document.getElementById('rightWing');

const leftWingBtn=document.getElementById('leftWingBtn');
const rightWingBtn=document.getElementById('rightWingBtn');

let leftOpen=false;
let rightOpen=false;

leftWingBtn.addEventListener('click',()=>{

  leftOpen=!leftOpen;

  leftWing.classList.toggle('active',leftOpen);

  leftWingBtn.classList.toggle('active',leftOpen);

});

rightWingBtn.addEventListener('click',()=>{

  rightOpen=!rightOpen;

  rightWing.classList.toggle('active',rightOpen);

  rightWingBtn.classList.toggle('active',rightOpen);

});

/* SCREEN CONTENT */

const screen=document.getElementById('screenContent');

const screenStuff=[

  "PIXIE<br>MAIL",

  "GLITTER<br>TXT",

  "MOONLIGHT<br>CHAT",

  "ENCHANTIX<br>ONLINE",

  "MAGIC<br>SELFIE",

  "♡ FAIRY<br>STATUS ♡",

  "NEW<br>SPELL",

  "STAR<br>CALL",

  "COSMIC<br>VOICEMAIL",

  "Y2K<br>GLAM",

  "LOADING<br>CHARMS",

  "♡♡♡"
];

document.querySelectorAll('.num-btn').forEach(btn=>{

  btn.addEventListener('click',(e)=>{

    const pick=screenStuff[
      Math.floor(Math.random()*screenStuff.length)
    ];

    screen.innerHTML=`
      <div class="screenText">${pick}</div>
    `;

    ripple(
      e.clientX,
      e.clientY
    );

    fairyDust(
      e.clientX,
      e.clientY
    );

  });

});

/* RIPPLE */

function ripple(x,y){

  const r=document.createElement('div');

  r.className='ripple';

  r.style.width='70px';
  r.style.height='70px';

  r.style.left=(x-35)+'px';
  r.style.top=(y-35)+'px';

  document.body.appendChild(r);

  r.addEventListener('animationend',()=>r.remove());

}

/* FAIRY DUST */

function fairyDust(x,y){

  const chars=['✦','✧','★','♡'];

  for(let i=0;i<12;i++){

    const d=document.createElement('div');

    d.className='dust';

    d.innerHTML=chars[
      Math.floor(Math.random()*chars.length)
    ];

    d.style.left=x+'px';
    d.style.top=y+'px';

    d.style.fontSize=(Math.random()*18+10)+'px';

    d.style.setProperty(
      '--x',
      (Math.random()*160-80)+'px'
    );

    d.style.setProperty(
      '--y',
      (Math.random()*-180)+'px'
    );

    document.body.appendChild(d);

    d.addEventListener('animationend',()=>d.remove());

  }

}

</script>

</body>
</html>
