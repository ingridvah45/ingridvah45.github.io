<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Winx Phone</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  min-height:100vh;
  background:radial-gradient(ellipse at 25% 15%,#ff80cc 0%,#ff40a8 30%,#cc1880 65%,#880050 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{
  position:absolute;
  animation:twinkle var(--dur,2s) ease-in-out infinite var(--delay,0s);
  opacity:0;font-size:var(--sz,10px);color:var(--c,#ffb3dc);
  filter:drop-shadow(0 0 4px var(--c,#ffb3dc));
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.3);}
  50%{opacity:1;transform:scale(1.2);}
}

/* 700px wide wrapper = 1.4× the 500-unit SVG viewBox */
#phone-wrap{
  position:relative;z-index:2;width:700px;flex-shrink:0;
  filter:drop-shadow(0 0 40px rgba(255,80,160,.65)) drop-shadow(0 25px 55px rgba(160,0,90,.5));
}
#phone-svg{width:100%;height:auto;overflow:visible;}

/* phone body */
#_x3C_background_x3E_{
  fill:url(#bodyGrad);
  stroke:#cc0080;stroke-width:1.5;
  filter:url(#bevel);
}

/* screen */
#phone_screen{fill:url(#screenGrad);stroke:#ff80c8;stroke-width:1.2;}

/* phone outline silhouette (st3 path) */
.st3-outline{fill:none;stroke:url(#bodyStrokeGrad);stroke-width:1.5;stroke-miterlimit:10;}

/* decoration arc */
#phone_decoration{fill:none;stroke:url(#arcGrad);stroke-width:2.5;stroke-miterlimit:10;}

/* inner d-pad lines — thicker now */
.dpad-inner{fill:none;stroke:rgba(255,130,210,.75);stroke-width:1.8;stroke-miterlimit:10;}

/* arrows */
#up_arrow,#down_arrow,#left_arrow,#right_arrow{
  fill:none;stroke:#ff50aa;stroke-width:2.5;stroke-linecap:round;stroke-miterlimit:10;
}

/* wing buttons */
#left_wing_button,#right_wing_button{
  fill:url(#wingBtnGrad);stroke:#ff50a0;stroke-width:1.4;
  cursor:pointer;transition:filter .15s;filter:url(#btnGlow);
}
#left_wing_button:hover,#right_wing_button:hover{filter:url(#btnGlowHot);}
#left_wing_button.toggled,#right_wing_button.toggled{fill:url(#wingBtnBlue);filter:url(#btnGlowBlue);}

/* numpad ovals — soap bubble */
.st2{
  fill:url(#bubbleGrad);stroke:rgba(140,210,255,.8);stroke-width:.8;stroke-miterlimit:10;
  cursor:pointer;transition:filter .12s;filter:url(#bubbleGlow);
}
.st2:hover{filter:url(#bubbleGlowHot);}
.st2:active{filter:brightness(.85);}

/* number labels — bigger, white with chrome shadow, clearly visible */
.numLabel{
  font-family:'VT323',monospace;
  font-size:14px;
  fill:white;
  stroke:rgba(80,160,255,.6);
  stroke-width:.4;
  pointer-events:none;
  filter:url(#chromeFlt);
}

/* WINGS — opaque, grouped */
#lwg,#rwg{
  transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
  opacity:0;transform:scale(0);
  transform-origin:250px 340px;
}
#lwg.active,#rwg.active{opacity:1;transform:scale(1);}

/* screen overlay — aligned to screen rect at 1.4× scale
   x=207.02*1.4=289.8  y=203.09*1.4=284.3
   w=85.95*1.4=120.3   h=91.2*1.4=127.7 */
#screen-content{
  position:absolute;
  left:290px;top:285px;width:120px;height:128px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;z-index:5;overflow:hidden;gap:2px;
}
#screen-line1,#screen-line2,#screen-line3{
  font-family:'VT323',monospace;text-align:center;line-height:1.15;max-width:100%;
  background:linear-gradient(180deg,#fff 0%,#c8e0ff 25%,#7090c8 50%,#c8deff 75%,#fff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 1px 3px rgba(100,180,255,.9));
}
#screen-line1{font-size:16px;letter-spacing:1px;}
#screen-line2{font-size:12px;}
#screen-line3{font-size:10px;letter-spacing:.5px;}

.ripple{
  position:fixed;border-radius:50%;pointer-events:none;z-index:999;
  animation:rippleOut .6s ease-out forwards;
  background:radial-gradient(circle,rgba(180,220,255,.8) 0%,rgba(255,160,220,.3) 60%,transparent 100%);
}
@keyframes rippleOut{from{transform:scale(0);opacity:1;}to{transform:scale(5);opacity:0;}}

.fburst{position:fixed;pointer-events:none;z-index:998;animation:fburstAnim .85s ease-out forwards;}
@keyframes fburstAnim{
  0%{opacity:1;transform:translate(0,0) scale(.5);}
  100%{opacity:0;transform:translate(var(--tx,0px),var(--ty,-55px)) scale(1.5) rotate(35deg);}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="phone-wrap">
  <div id="screen-content">
    <div id="screen-line1">✦ WINX ✦</div>
    <div id="screen-line2">CLUB</div>
    <div id="screen-line3">· ready ·</div>
  </div>

  <svg id="phone-svg" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- body gradient: rich pink with more depth -->
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#ffc0ec"/>
        <stop offset="15%" stop-color="#ff88d0"/>
        <stop offset="35%" stop-color="#ff30a0"/>
        <stop offset="55%" stop-color="#e8008c"/>
        <stop offset="75%" stop-color="#ff50b8"/>
        <stop offset="100%" stop-color="#ffb8e8"/>
      </linearGradient>

      <linearGradient id="bodyStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#ffd8f8"/>
        <stop offset="50%" stop-color="#ff40b0"/>
        <stop offset="100%" stop-color="#aa0070"/>
      </linearGradient>

      <!-- screen -->
      <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="#180620"/>
        <stop offset="100%" stop-color="#060010"/>
      </linearGradient>

      <!-- arc -->
      <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#ff40a0"/>
        <stop offset="50%" stop-color="#ffd0f8"/>
        <stop offset="100%" stop-color="#ff40a0"/>
      </linearGradient>

      <!-- wings: solid opaque pink+blue, no gap, seamless -->
      <linearGradient id="wingFill" x1="0%" y1="0%" x2="60%" y2="100%">
        <stop offset="0%"  stop-color="#ff80c4"/>
        <stop offset="30%" stop-color="#ffb0e0"/>
        <stop offset="60%" stop-color="#a0d0ff"/>
        <stop offset="100%" stop-color="#60aaff"/>
      </linearGradient>
      <linearGradient id="wingStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#ff90cc"/>
        <stop offset="100%" stop-color="#80c8ff"/>
      </linearGradient>

      <!-- wing buttons -->
      <linearGradient id="wingBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#ffe4f8"/>
        <stop offset="50%" stop-color="#ff70c0"/>
        <stop offset="100%" stop-color="#cc1880"/>
      </linearGradient>
      <linearGradient id="wingBtnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#e4f8ff"/>
        <stop offset="50%" stop-color="#80d8ff"/>
        <stop offset="100%" stop-color="#40a8e0"/>
      </linearGradient>

      <!-- numpad soap bubble -->
      <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="rgba(220,244,255,.88)"/>
        <stop offset="40%" stop-color="rgba(150,210,255,.72)"/>
        <stop offset="100%" stop-color="rgba(100,185,255,.80)"/>
      </linearGradient>

      <!-- silver for number labels -->
      <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#c0d8f8"/>
        <stop offset="55%" stop-color="#8090c0"/>
        <stop offset="80%" stop-color="#d8e8ff"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>

      <!-- glitter pattern for body -->
      <pattern id="glitter" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="none"/>
        <circle cx="2"  cy="2"  r=".9" fill="white" opacity=".85"/>
        <circle cx="9"  cy="4"  r=".5" fill="#ffe0f8" opacity=".8"/>
        <circle cx="14" cy="1"  r=".7" fill="white" opacity=".75"/>
        <circle cx="4"  cy="11" r=".4" fill="#ffc0f0" opacity=".85"/>
        <circle cx="12" cy="12" r=".8" fill="white" opacity=".8"/>
        <circle cx="1"  cy="14" r=".5" fill="#f0d0ff" opacity=".75"/>
        <circle cx="15" cy="8"  r=".6" fill="white" opacity=".7"/>
        <circle cx="7"  cy="15" r=".45" fill="#ffd0ff" opacity=".85"/>
        <circle cx="11" cy="7"  r=".35" fill="white" opacity=".75"/>
        <circle cx="5"  cy="6"  r=".3" fill="#ffddf8" opacity=".9"/>
        <circle cx="13" cy="5"  r=".4" fill="white" opacity=".8"/>
      </pattern>

      <!-- glitter for wings -->
      <pattern id="wingGlitter" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="14" height="14" fill="none"/>
        <circle cx="2"  cy="2"  r="1"   fill="white" opacity=".9"/>
        <circle cx="7"  cy="4"  r=".6"  fill="#c8e8ff" opacity=".85"/>
        <circle cx="12" cy="1"  r=".7"  fill="white" opacity=".8"/>
        <circle cx="4"  cy="10" r=".5"  fill="#ffd0f8" opacity=".85"/>
        <circle cx="11" cy="11" r=".8"  fill="white" opacity=".8"/>
        <circle cx="1"  cy="13" r=".5"  fill="#d8f0ff" opacity=".85"/>
        <circle cx="13" cy="8"  r=".6"  fill="white" opacity=".75"/>
        <circle cx="6"  cy="13" r=".45" fill="#ffc8f0" opacity=".9"/>
        <circle cx="9"  cy="7"  r=".4"  fill="white" opacity=".8"/>
      </pattern>

      <!-- FILTERS -->
      <!-- bevel for body -->
      <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
        <feOffset dx="-4" dy="-4" in="blur" result="ob1"/>
        <feOffset dx="4"  dy="4"  in="blur" result="ob2"/>
        <feFlood flood-color="white"   flood-opacity=".65" result="white"/>
        <feFlood flood-color="#800040" flood-opacity=".5"  result="dark"/>
        <feComposite in="white" in2="ob1" operator="in" result="hi"/>
        <feComposite in="dark"  in2="ob2" operator="in" result="sh"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="hi"/>
          <feMergeNode in="sh"/>
        </feMerge>
      </filter>

      <!-- wing glow -->
      <filter id="wingGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values="1 0 .4 0 .05  0 .4 1 0 .05  .5 0 1 0 .1  0 0 0 .85 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- btn glows -->
      <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="btnGlowHot" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values="1.4 0 .4 0 0  0 .2 .8 0 0  .4 0 1.2 0 0  0 0 0 1.8 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="btnGlowBlue" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values=".2 0 .4 0 0  0 .5 1 0 0  .5 0 1.5 0 0  0 0 0 1.8 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- bubble glow -->
      <filter id="bubbleGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values=".3 0 .5 0 0  0 .5 1 0 0  .5 0 1.2 0 0  0 0 0 1 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bubbleGlowHot" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values=".3 0 .5 0 0  0 .6 1.2 0 0  .6 0 1.5 0 0  0 0 0 1.5 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- chrome shadow for labels -->
      <filter id="chromeFlt" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation=".6" result="blur"/>
        <feOffset dx="0" dy="1" in="blur" result="off"/>
        <feFlood flood-color="rgba(60,140,255,.7)" result="col"/>
        <feComposite in="col" in2="off" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

<script>
// ── twinkling star background ──
(function(){

  const ch=['✦','✧','★','✺','·'];
  for(let i=0;i<75;i++){
    const s=document.createElement('div');
    s.className='star';
    s.textContent=ch[Math.floor(Math.random()*ch.length)];
    s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;`
      +`--sz:${(Math.random()*13+5)}px;--c:${p[Math.floor(Math.random()*p.length)]};`
      +`--dur:${(Math.random()*3+1.2).toFixed(1)}s;--delay:-${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
})();

const lwg=document.getElementById('lwg');
const rwg=document.getElementById('rwg');
const lwb=document.getElementById('left_wing_button');
const rwb=document.getElementById('right_wing_button');
const sl1=document.getElementById('screen-line1');
const sl2=document.getElementById('screen-line2');
const sl3=document.getElementById('screen-line3');
let leftOn=false,rightOn=false;

const msgs={
  '1':[['✦ BLOOM ✦','fairy of fire','winx s01 ♡'],['✦ MISS U ✦','call me pls!','xoxo bloom'],['★ POWER ★','believix!','go winx!!']],
  '2':[['✧ STELLA ✧','fashion queen','sun fairy ☀'],['♡ GLAM ♡','new outfit!','fabulous~'],['★ SHINE ★','solaria pwr','dazzle!!']],
  '3':[['✦ AISHA ✦','fairy of waves','ocean ♡♡'],['✧ DANCE ✧','groove time!','feel it~'],['★ MORPH ★','morphix pwr','splash!!']],
  '4':[['✦ FLORA ✦','nature fairy','garden ♡'],['✧ BLOOM ✧','new flower!','growing~'],['★ PETAL ★','charmix!','blossom!!']],
  '5':[['✦ MUSA ✦','music fairy','melody ♡'],['✧ SONG ✧','new ringtone','download~'],['★ BEAT ★','harmonic!','play it!!']],
  '6':[['✦ TECNA ✦','tech fairy','wifi full ♡'],['✧ CYBER ✧','connected!','online~'],['★ POWER ★','technomagic','loading!!']],
  '7':[['✧ ALFEA ✧','school day','late 4 class'],['✦ NITE ✦','sweet dreamz','nite nite~'],['★ MAGIC ★','study time','fairies!!']],
  '8':[['✦ SPELL ✦','new power!','unlocked ♡'],['✧ GLITTER✧','sparkle pwr','shimmer~'],['★ WINX ★','transform!','magic!!']],
  '9':[['✦ ENCHIX✦','fairy queen','royalty ♡'],['✧ DREAM ✧','fairy world','believe~'],['★ RAINBOW★','colour pwr','fly!!']],
  '0':[['✦ DIAL ✦','calling...','please hold'],['✧ MSG ✧','1 new txt','from: bloom'],['★ RING ★','fairy bells','answering!']],
};

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function setScreen(key){
  const[a,b,cc]=pick(msgs[key]||[['✦ WINX ✦','CLUB','· magic ·']]);
  sl1.textContent=a;sl2.textContent=b;sl3.textContent=cc;
}

function fairyBurst(x,y){
  const ch=['✦','✧','★','✺','·'];
  const col=['#ff70b8','#ffaadd','#c4e8ff','#ffdcf4','#f8b4ff','#88d4ff'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div');
    el.className='fburst';
    el.textContent=ch[Math.floor(Math.random()*ch.length)];
    const ang=Math.random()*Math.PI*2, d=28+Math.random()*55;
    el.style.cssText=`left:${x}px;top:${y}px;color:${col[Math.floor(Math.random()*col.length)]};`
      +`font-size:${9+Math.random()*14}px;--tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d-48}px;`
      +`animation-delay:${Math.random()*.14}s;filter:drop-shadow(0 0 5px currentColor);`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

function ripple(x,y){
  const r=document.createElement('div');r.className='ripple';const s=65;
  r.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;`;
  document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
}

function center(el){const rc=el.getBoundingClientRect();return[rc.left+rc.width/2,rc.top+rc.height/2];}

lwb.addEventListener('click',()=>{
  leftOn=!leftOn;
  lwg.style.opacity=leftOn?'1':'0';lwg.style.transform=leftOn?'scale(1)':'scale(0)';
  lwb.classList.toggle('toggled',leftOn);
  const[cx,cy]=center(lwb);ripple(cx,cy);fairyBurst(cx,cy);
  sl1.textContent='✦ WINGS ✦';sl2.textContent=leftOn?'left open':'left closed';sl3.textContent='· magic ·';
});

rwb.addEventListener('click',()=>{
  rightOn=!rightOn;
  rwg.style.opacity=rightOn?'1':'0';rwg.style.transform=rightOn?'scale(1)':'scale(0)';
  rwb.classList.toggle('toggled',rightOn);
  const[cx,cy]=center(rwb);ripple(cx,cy);fairyBurst(cx,cy);
  sl1.textContent='✦ WINGS ✦';sl2.textContent=rightOn?'right open':'right closed';sl3.textContent='· magic ·';
});

document.querySelectorAll('.numpad-btn').forEach(el=>{
  el.addEventListener('click',e=>{
    const[cx,cy]=center(e.currentTarget);ripple(cx,cy);fairyBurst(cx,cy);
    setScreen(e.currentTarget.dataset.key);
  });
});

[lwb,rwb].forEach(b=>{
  b.addEventListener('touchstart',e=>{e.preventDefault();b.dispatchEvent(new MouseEvent('click'));},{passive:false});
});
</script>
