<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fairy Phone</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
height:100vh;
min-height:100vh;
background:radial-gradient(ellipse at 25% 15%,#ff80cc 0%,#ff40a8 30%,#cc1880 65%,#880050 100%);
display:flex;align-items:center;justify-content:center;
overflow:hidden;position:relative;
}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{
position:absolute;
animation:twinkle var(--dur,2s) ease-in-out infinite var(--delay,0s);
opacity:0;font-size:var(--sz,10px);color:var(--c,#ffb3dc);
filter:drop-shadow(0 0 4px var(--c,#ffb3dc));
}
@keyframes twinkle{
0%,100%{opacity:0;transform:scale(.3);}
50%{opacity:1;transform:scale(1.2);}
}

#phone-wrap{
position:relative;z-index:2;width:min(680px,92vw);flex-shrink:0;
}
#phone-svg{width:100%;height:auto;overflow:visible;}

#_x3C_background_x3E_{fill:url(#bodyGrad);stroke:none;}

#phone_screen{fill:url(#screenGrad);stroke:rgba(255,180,220,.6);stroke-width:.8;}

.inner-lines{
fill:none;
stroke:rgba(220,100,170,.42);
stroke-width:1.6;
stroke-miterlimit:10;
stroke-linecap:round;
stroke-linejoin:round;
filter:url(#softLine);
}

#phone_decoration{
fill:none;
stroke:rgba(220,100,170,.40);
stroke-width:1.6;
stroke-miterlimit:10;
stroke-linecap:round;
stroke-linejoin:round;
filter:url(#softLine);
}

.body-border{
fill:none;
stroke:rgba(220,100,170,.28);
stroke-width:.9;
stroke-miterlimit:10;
stroke-linecap:round;
stroke-linejoin:round;
filter:url(#softLine);
}

.dpad-inner{
fill:none;
stroke:rgba(220,100,170,.44);
stroke-width:1.6;
stroke-miterlimit:10;
stroke-linecap:round;
stroke-linejoin:round;
filter:url(#softLine);
}

.dpad-tab{
fill:url(#wingBtnGrad);
stroke:rgba(255,160,210,.3);
stroke-width:.6;
stroke-miterlimit:10;
stroke-linecap:round;
stroke-linejoin:round;
}

/* arrows — same blue as numpad buttons */
#up_arrow,#down_arrow,#left_arrow,#right_arrow{
fill:none;stroke:rgba(100,200,255,.9);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;
filter:drop-shadow(0 0 3px rgba(80,180,255,.85));
cursor:pointer;
}
#up_arrow:hover,#down_arrow:hover,#left_arrow:hover,#right_arrow:hover{
stroke:#ffffff;filter:drop-shadow(0 0 5px rgba(150,220,255,1));
}

#left_wing_button,#right_wing_button{
fill:url(#wingBtnGrad);stroke:#ff50a0;stroke-width:1.4;
stroke-linecap:round;stroke-linejoin:round;
cursor:pointer;transition:filter .15s;filter:url(#btnGlow);
}
#left_wing_button:hover,#right_wing_button:hover{filter:url(#btnGlowHot);}
#left_wing_button.toggled,#right_wing_button.toggled{fill:url(#wingBtnBlue);filter:url(#btnGlowBlue);}

.st2{
fill:url(#bubbleGrad);stroke:rgba(140,210,255,.8);stroke-width:.8;stroke-miterlimit:10;
stroke-linecap:round;stroke-linejoin:round;
cursor:pointer;transition:filter .12s;filter:url(#bubbleGlow);
}
.st2:hover{filter:url(#bubbleGlowHot);}
.st2:active{filter:brightness(.85);}

.numLabel{
font-family:'VT323',monospace;font-size:14px;fill:white;
text-anchor:middle;dominant-baseline:middle;
pointer-events:none;filter:url(#chromeFlt);
}

#lwg{
transform-box:fill-box;transform-origin:right center;
transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
opacity:0;transform:scaleX(0);
}
#rwg{
transform-box:fill-box;transform-origin:left center;
transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
opacity:0;transform:scaleX(0);
}
#lwg.active,#rwg.active{opacity:1;transform:scaleX(1);}

/* screen overlay — % of phone-wrap (SVG viewBox 500w×700h) */
#screen-content{
position:absolute;
left:41.4%;top:29.0%;width:17.2%;height:13.0%;
display:flex;flex-direction:column;align-items:center;justify-content:center;
pointer-events:none;z-index:5;overflow:hidden;gap:2px;
}
#screen-line1,#screen-line2,#screen-line3{
font-family:'VT323',monospace;text-align:center;line-height:1.15;max-width:100%;
background:linear-gradient(180deg,#fff 0%,#c8e0ff 25%,#7090c8 50%,#c8deff 75%,#fff 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(0 1px 3px rgba(100,180,255,.9));
}
#screen-line1{font-size:clamp(10px,2vw,22px);letter-spacing:1px;}
#screen-line2{font-size:clamp(9px,1.6vw,17px);}
#screen-line3{font-size:clamp(8px,1.3vw,14px);letter-spacing:.5px;}

/* app screen — pixel art style mini display */
#app-screen{
display:none;
position:absolute;top:0;left:0;width:100%;height:100%;
flex-direction:column;
font-family:'VT323',monospace;
color:#ffffff;
font-size:12px;
padding:6px 5px;
overflow:hidden;
gap:1px;
background:transparent;
z-index:6;
pointer-events:none;
}
#app-title{
font-size:16px;letter-spacing:1px;text-align:center;
background:linear-gradient(90deg,#ff80cc,#80ccff,#ff80cc);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(0 0 4px rgba(255,150,200,.6));
margin-bottom:2px;
border-bottom:1px solid rgba(255,150,200,.25);
padding-bottom:2px;
}
.app-row{
display:flex;align-items:center;gap:4px;
color:rgba(255,230,245,.85);
font-size:11px;
padding:1px 0;
border-bottom:1px solid rgba(255,150,200,.08);
}
.app-icon{font-size:12px;width:14px;text-align:center;}
.app-val{margin-left:auto;color:rgba(150,210,255,.9);font-size:11px;}

#snake-canvas{
display:none;
position:absolute;top:0;left:0;
width:100%;height:100%;
image-rendering:pixelated;
}

#snake-score{
display:none;
position:absolute;top:3px;right:7px;
font-family:'VT323',monospace;font-size:15px;
color:#ff80cc;
filter:drop-shadow(0 0 3px #ff40a0);
z-index:6;
pointer-events:none;
}

#snake-over{
display:none;
position:absolute;top:0;left:0;width:100%;height:100%;
flex-direction:column;align-items:center;justify-content:center;
background:rgba(5,0,15,.85);gap:3px;z-index:7;
pointer-events:none;
}
#snake-over span{
font-family:'VT323',monospace;text-align:center;
background:linear-gradient(180deg,#fff 0%,#ffaadd 50%,#fff 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#snake-over .over-title{font-size:20px;letter-spacing:1px;}
#snake-over .over-score{font-size:16px;}
#snake-over .over-hint{font-size:13px;color:#ff80cc;-webkit-text-fill-color:#ff80cc;}

.ripple{
position:fixed;border-radius:50%;pointer-events:none;z-index:999;
animation:rippleOut .6s ease-out forwards;
background:radial-gradient(circle,rgba(255,220,240,.9) 0%,rgba(255,160,220,.4) 60%,transparent 100%);
}
@keyframes rippleOut{from{transform:scale(0);opacity:1;}to{transform:scale(5);opacity:0;}}

.fburst{position:fixed;pointer-events:none;z-index:998;animation:fburstAnim .85s ease-out forwards;}
@keyframes fburstAnim{
0%{opacity:1;transform:translate(0,0) scale(.5);}
100%{opacity:0;transform:translate(var(--tx,0px),var(--ty,-55px)) scale(1.5) rotate(35deg);}
}

.gspark{
position:fixed;pointer-events:none;z-index:997;border-radius:50%;
animation:gsparkAnim var(--gd,.9s) ease-out forwards;
}
@keyframes gsparkAnim{
0%{opacity:1;transform:translate(0,0) scale(1);}
100%{opacity:0;transform:translate(var(--gx,0px),var(--gy,30px)) scale(0);}
}

#hint{
position:relative;z-index:3;
margin-top:12px;
font-family:'VT323',monospace;
font-size:clamp(14px,1.8vw,26px);
color:rgba(255,220,240,.85);
letter-spacing:3px;
text-shadow:0 0 16px rgba(255,100,180,.7);
text-align:center;
pointer-events:none;
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
<div id="phone-wrap">
  <div id="screen-content">
    <div id="screen-line1" style="display:none">✦ FAIRY ✦</div>
    <div id="screen-line2" style="display:none">PHONE</div>
    <div id="screen-line3" style="display:none">· ready ·</div>

    <!-- app screen panel (shows over idle text) -->
    <div id="app-screen">
      <div id="app-title">SETTINGS</div>
      <div id="app-body"></div>
    </div>

    <canvas id="snake-canvas" width="172" height="182"></canvas>
    <div id="snake-score">★0</div>
    <div id="snake-over">
      <span class="over-title">GAME OVER</span>
      <span class="over-score" id="over-score-txt">★ 0</span>
      <span class="over-hint">press 0 to retry</span>
    </div>
  </div>

  <svg id="phone-svg" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>

  <!-- body: mid-tone pink — not too light, not too dark, lines visible -->
  <linearGradient id="bodyGrad" x1="5%" y1="0%" x2="95%" y2="100%">
  <stop offset="0%"   stop-color="#ffccee"/>
  <stop offset="18%"  stop-color="#ff99d8"/>
  <stop offset="38%"  stop-color="#ff66bb"/>
  <stop offset="58%"  stop-color="#e8389a"/>
  <stop offset="78%"  stop-color="#cc1878"/>
  <stop offset="100%" stop-color="#a01060"/>
  </linearGradient>

  <radialGradient id="specGrad" cx="28%" cy="18%" r="45%">
  <stop offset="0%"   stop-color="white" stop-opacity=".22"/>
  <stop offset="50%"  stop-color="white" stop-opacity=".06"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="rimGrad" cx="80%" cy="88%" r="40%">
  <stop offset="0%"   stop-color="#ffd0f0" stop-opacity=".15"/>
  <stop offset="100%" stop-color="#ffd0f0" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#180620"/>
  <stop offset="100%" stop-color="#060010"/>
  </linearGradient>

  <linearGradient id="wingFillTop" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"   stop-color="#ffaadd" stop-opacity=".95"/>
  <stop offset="25%"  stop-color="#ff80cc" stop-opacity=".9"/>
  <stop offset="50%"  stop-color="#d8a8ff" stop-opacity=".88"/>
  <stop offset="75%"  stop-color="#a8d8ff" stop-opacity=".9"/>
  <stop offset="100%" stop-color="#80c0ff" stop-opacity=".92"/>
  </linearGradient>

  <linearGradient id="wingStroke" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"   stop-color="#ff90cc"/>
  <stop offset="100%" stop-color="#70c0ff"/>
  </linearGradient>

  <linearGradient id="wingBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"   stop-color="#ffe4f8"/>
  <stop offset="50%"  stop-color="#ff70c0"/>
  <stop offset="100%" stop-color="#cc1880"/>
  </linearGradient>
  <linearGradient id="wingBtnBlue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"   stop-color="#e4f8ff"/>
  <stop offset="50%"  stop-color="#80d8ff"/>
  <stop offset="100%" stop-color="#40a8e0"/>
  </linearGradient>

  <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%"   stop-color="rgba(220,244,255,.88)"/>
  <stop offset="40%"  stop-color="rgba(150,210,255,.72)"/>
  <stop offset="100%" stop-color="rgba(100,185,255,.80)"/>
  </linearGradient>

  <pattern id="glitter" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="none"/>
  <circle cx="1"   cy="1"   r="1.2" fill="white"   opacity=".85"/>
  <circle cx="5"   cy="1.5" r=".7"  fill="#ffccee" opacity=".8"/>
  <circle cx="9"   cy=".8"  r="1"   fill="white"   opacity=".8"/>
  <circle cx="2.5" cy="5"   r=".6"  fill="#ffbbdd" opacity=".78"/>
  <circle cx="7"   cy="4"   r=".9"  fill="white"   opacity=".82"/>
  <circle cx=".5"  cy="8.5" r=".7"  fill="#f8c0ff" opacity=".75"/>
  <circle cx="5"   cy="8"   r="1"   fill="white"   opacity=".82"/>
  <circle cx="9"   cy="7.5" r=".6"  fill="#ffb8ee" opacity=".8"/>
  <circle cx="3"   cy="9.5" r=".8"  fill="white"   opacity=".78"/>
  <circle cx="8"   cy="9.5" r=".5"  fill="#ffccff" opacity=".8"/>
  <circle cx="4"   cy="3.5" r=".4"  fill="white"   opacity=".75"/>
  <circle cx="6.5" cy="6.5" r=".4"  fill="#ffeeff" opacity=".8"/>
  </pattern>

  <pattern id="wingGlitter" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="none"/>
  <circle cx="1.5" cy="1.5" r="1.1" fill="white" opacity=".92"/>
  <circle cx="6"   cy="3"   r=".65" fill="#e8d8ff" opacity=".88"/>
  <circle cx="10"  cy="1"   r=".8"  fill="white"   opacity=".85"/>
  <circle cx="3"   cy="8"   r=".55" fill="#ffd8f8"  opacity=".88"/>
  <circle cx="9"   cy="9"   r=".9"  fill="white"   opacity=".85"/>
  <circle cx=".8"  cy="11"  r=".55" fill="#d8f0ff"  opacity=".88"/>
  <circle cx="11"  cy="6"   r=".65" fill="white"   opacity=".8"/>
  <circle cx="5"   cy="11"  r=".5"  fill="#ffc8f8"  opacity=".92"/>
  <circle cx="7.5" cy="6"   r=".45" fill="white"   opacity=".85"/>
  <circle cx="3.5" cy="4.5" r=".35" fill="#c8e8ff"  opacity=".88"/>
  </pattern>

  <filter id="shimmer" x="0%" y="0%" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" seed="2" result="noise">
  <animate attributeName="seed" values="1;8;3;6;2" dur="2.5s" repeatCount="indefinite"/>
  </feTurbulence>
  <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
  <feComposite in="SourceGraphic" in2="grey" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="bright"/>
  <feBlend in="SourceGraphic" in2="bright" mode="screen"/>
  </filter>

  <filter id="softLine" x="-8%" y="-8%" width="116%" height="116%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
  <feMerge>
  <feMergeNode in="blur"/>
  <feMergeNode in="SourceGraphic"/>
  </feMerge>
  </filter>

  <filter id="wingGlow" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values="1.1 0 .3 0 .05  0 .3 .9 0 .05  .4 0 1.1 0 .08  0 0 0 .8 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="btnGlowHot" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values="1.4 0 .4 0 0  0 .2 .8 0 0  .4 0 1.2 0 0  0 0 0 1.8 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="btnGlowBlue" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values=".2 0 .4 0 0  0 .5 1 0 0  .5 0 1.5 0 0  0 0 0 1.8 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bubbleGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values=".3 0 .5 0 0  0 .5 1 0 0  .5 0 1.2 0 0  0 0 0 1 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bubbleGlowHot" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values=".3 0 .5 0 0  0 .6 1.2 0 0  .6 0 1.5 0 0  0 0 0 1.5 0" result="c"/>
  <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="chromeFlt" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation=".6" result="blur"/>
  <feOffset dx="0" dy="1" in="blur" result="off"/>
  <feFlood flood-color="rgba(60,140,255,.7)" result="col"/>
  <feComposite in="col" in2="off" operator="in" result="shadow"/>
  <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="leftWingClip">
  <rect x="-200" y="0" width="395" height="700"/>
  </clipPath>
  <clipPath id="rightWingClip">
  <rect x="305" y="0" width="400" height="700"/>
  </clipPath>

  <!-- clip path matching the phone body outline — glitter stays inside -->
  <clipPath id="bodyClip">

  </clipPath>

  </defs>

  <!-- LEFT WING -->

// ── SNAKE ──
const COLS=17,ROWS=18,CELL=10;
const canvas    = document.getElementById('snake-canvas');
const ctx       = canvas.getContext('2d');
const scoreEl   = document.getElementById('snake-score');
const overEl    = document.getElementById('snake-over');
const overScoreTxt = document.getElementById('over-score-txt');
const line1 = document.getElementById('screen-line1');
const line2 = document.getElementById('screen-line2');
const line3 = document.getElementById('screen-line3');
const hint  = document.getElementById('hint');

let snake,dir,nextDir,food,score,gameLoop,gameState;

function loadGame(){
  snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
  dir={x:0,y:0};nextDir={x:0,y:0};
  food=spawnFood();score=0;gameState='loaded';
  line1.style.display='none';line2.style.display='none';line3.style.display='none';
  appScreenEl.style.display='none';
  overEl.style.display='none';
  canvas.style.display='block';scoreEl.style.display='block';
  scoreEl.textContent='★0';
  hint.textContent='✦ press an arrow to start ✦';
  clearInterval(gameLoop);draw();
}

function startGame(dx,dy){
  nextDir={x:dx,y:dy};dir={x:dx,y:dy};
  gameState='running';hint.style.display='none';
  clearInterval(gameLoop);
  gameLoop=setInterval(tick,260);
}

function spawnFood(){
  let f;
  do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}

function tick(){
  dir={...nextDir};
  if(dir.x===0&&dir.y===0) return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){endGame();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){endGame();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;scoreEl.textContent='★'+score;food=spawnFood();
  }else{snake.pop();}
  draw();
}

function draw(){
  ctx.fillStyle='#080010';ctx.fillRect(0,0,172,182);
  ctx.fillStyle='#ff70c0';ctx.shadowColor='#ff40a0';ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-.5,0,Math.PI*2);
  ctx.fill();ctx.shadowBlur=0;
  snake.forEach((seg,i)=>{
    const isHead=i===0;
    ctx.fillStyle=isHead?'#00d8ff':'#0090d0';
    ctx.shadowColor=isHead?'#00d8ff':'transparent';
    ctx.shadowBlur=isHead?7:0;
    const pad=isHead?0:.5;
    ctx.fillRect(seg.x*CELL+pad,seg.y*CELL+pad,CELL-pad*2,CELL-pad*2);
  });
  ctx.shadowBlur=0;
}

function endGame(){
  clearInterval(gameLoop);gameState='over';
  canvas.style.display='none';scoreEl.style.display='none';
  overScoreTxt.textContent='★ '+score;
  overEl.style.display='flex';hint.style.display='block';
  hint.textContent='✦ press 0 to play again ✦';
}

function setDir(dx,dy){
  if(gameState==='loaded'){startGame(dx,dy);return;}
  if(gameState!=='running') return;
  if(dx===-dir.x&&dy===-dir.y) return;
  nextDir={x:dx,y:dy};
}

function fairyBurst(x,y){
  const ch=['✦','✧','★','✺','·'];
  const col=['#ff70b8','#ffaadd','#c4e8ff','#ffdcf4','#f8b4ff','#88d4ff'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='fburst';
    el.textContent=ch[Math.floor(Math.random()*ch.length)];
    const ang=Math.random()*Math.PI*2,d=28+Math.random()*55;
    el.style.cssText=`left:${x}px;top:${y}px;color:${col[Math.floor(Math.random()*col.length)]};`
      +`font-size:${9+Math.random()*14}px;--tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d-48}px;`
      +`animation-delay:${Math.random()*.14}s;filter:drop-shadow(0 0 5px currentColor);`;
    document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
  }
}
function ripple(x,y){
  const r=document.createElement('div');r.className='ripple';const s=65;
  r.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;`;
  document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
}
function center(el){const rc=el.getBoundingClientRect();return[rc.left+rc.width/2,rc.top+rc.height/2];}

function showIdleScreen(){
  appScreenEl.style.display='none';
  canvas.style.display='none';scoreEl.style.display='none';overEl.style.display='none';
  line1.style.display='';line2.style.display='';line3.style.display='';
  line1.textContent='✦ FAIRY ✦';line2.textContent='PHONE';line3.textContent='· ready ·';
}

gameState='idle';
// screen starts black — no showIdleScreen() on load

// NUMPAD — 1-9 show app screens, 0 loads snake
document.querySelectorAll('.numpad-btn').forEach(el=>{
  el.addEventListener('click',e=>{
    const key=e.currentTarget.dataset.key;
    const[cx,cy]=center(e.currentTarget);
    ripple(cx,cy);fairyBurst(cx,cy);
    if(key==='0'){
      loadGame();
    } else {
      if(gameState==='running') return; // don't interrupt snake
      gameState='idle';
      clearInterval(gameLoop);
      showApp(key);
      hint.textContent='✦ press 0 to load snake ✦';
      hint.style.display='block';
    }
  });
});

// arrow direction handler — used by svg paths, hit rects, wing buttons, and keyboard
function handleArrow(dx,dy){
  const[cx,cy]=[window.innerWidth/2, window.innerHeight/2];
  ripple(cx,cy);
  setDir(dx,dy);
}

// arrow visible paths
document.getElementById('up_arrow').addEventListener('click',   ()=>handleArrow(0,-1));
document.getElementById('down_arrow').addEventListener('click',  ()=>handleArrow(0,1));
document.getElementById('right_arrow').addEventListener('click', ()=>handleArrow(1,0));
document.getElementById('left_arrow').addEventListener('click',  ()=>handleArrow(-1,0));
// arrow large invisible hit rects
document.getElementById('up_arrow_hit').addEventListener('click',   ()=>handleArrow(0,-1));
document.getElementById('down_arrow_hit').addEventListener('click',  ()=>handleArrow(0,1));
document.getElementById('right_arrow_hit').addEventListener('click', ()=>handleArrow(1,0));
document.getElementById('left_arrow_hit').addEventListener('click',  ()=>handleArrow(-1,0));

// WING BUTTONS — left=snake up/right, right=snake down/left, toggled state changes direction
lwb.addEventListener('click',()=>{
  leftOn=!leftOn;lwg.classList.toggle('active',leftOn);lwb.classList.toggle('toggled',leftOn);
  const[cx,cy]=center(lwb);ripple(cx,cy);fairyBurst(cx,cy);
  // also steer snake: left wing button = go left
  if(gameState==='running'||gameState==='loaded'){
    setDir(-1,0);
  } else {
    line1.style.display='';line2.style.display='';line3.style.display='';
    appScreenEl.style.display='none';
    line1.textContent='✦ WINGS ✦';line2.textContent=leftOn?'left open':'left closed';line3.textContent='';
  }
});
rwb.addEventListener('click',()=>{
  rightOn=!rightOn;rwg.classList.toggle('active',rightOn);rwb.classList.toggle('toggled',rightOn);
  const[cx,cy]=center(rwb);ripple(cx,cy);fairyBurst(cx,cy);
  // right wing button = go right
  if(gameState==='running'||gameState==='loaded'){
    setDir(1,0);
  } else {
    line1.style.display='';line2.style.display='';line3.style.display='';
    appScreenEl.style.display='none';
    line1.textContent='✦ WINGS ✦';line2.textContent=rightOn?'right open':'right closed';line3.textContent='';
  }
});

// KEYBOARD
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')    {e.preventDefault();handleArrow(0,-1);}
  if(e.key==='ArrowDown')  {e.preventDefault();handleArrow(0,1);}
  if(e.key==='ArrowLeft')  {e.preventDefault();handleArrow(-1,0);}
  if(e.key==='ArrowRight') {e.preventDefault();handleArrow(1,0);}
});

// TOUCH
[lwb,rwb].forEach(b=>{
  b.addEventListener('touchstart',e=>{e.preventDefault();b.dispatchEvent(new MouseEvent('click'));},{passive:false});
});

// GLITTER SPILL (unchanged)
const phoneSvg=document.getElementById('phone-svg');
const glitterColors=['#ffffff','#ffd6f4','#ffb3e6','#ffc8ff','#d4b0ff','#b8d8ff','#ffe0ff','#fff0b8'];
let lastGlitterTime=0;
phoneSvg.addEventListener('mousemove',e=>{
  const now=Date.now();if(now-lastGlitterTime<40) return;lastGlitterTime=now;
  const rect=phoneSvg.getBoundingClientRect();
  const mx=e.clientX,my=e.clientY;
  const relX=(mx-rect.left)/rect.width,relY=(my-rect.top)/rect.height;
  if(relX<0.27||relX>0.73||relY<0.14||relY>0.95) return;
  const count=2+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const spark=document.createElement('div');spark.className='gspark';
    const sz=3+Math.random()*6,col=glitterColors[Math.floor(Math.random()*glitterColors.length)];
    const ang=Math.random()*Math.PI*2,dist=15+Math.random()*40,dur=(.5+Math.random()*.6).toFixed(2);
    spark.style.cssText=`left:${mx}px;top:${my}px;width:${sz}px;height:${sz}px;`
      +`background:${col};box-shadow:0 0 ${sz*1.5}px ${col};`
      +`--gx:${(Math.cos(ang)*dist).toFixed(1)}px;--gy:${(Math.sin(ang)*dist+10).toFixed(1)}px;`
      +`--gd:${dur}s;animation-delay:${(Math.random()*.08).toFixed(2)}s;`;
    document.body.appendChild(spark);spark.addEventListener('animationend',()=>spark.remove());
  }
});
</script>
</body>
</html>
