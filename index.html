<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fairy Phone ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=VT323&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 25% 15%, #ffc0e8 0%, #ffaade 30%, #f8d0ff 60%, #ffd6f5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
    position: relative;
  }

  /* ── floating glitter particles ── */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    animation: twinkle var(--dur,2s) ease-in-out infinite var(--delay,0s);
    opacity: 0;
  }
  .star::before {
    content: '✦';
    font-size: var(--sz, 10px);
    color: var(--c, #ffb3dc);
    display: block;
    filter: drop-shadow(0 0 3px var(--c, #ffb3dc));
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1.2) rotate(20deg); }
  }

  /* floating sparkles drifting up */
  .drift {
    position: absolute;
    pointer-events: none;
    animation: driftUp var(--dur,6s) ease-in infinite var(--delay,0s);
    opacity: 0;
    font-size: var(--sz, 10px);
    color: var(--c, #ff80c0);
    filter: drop-shadow(0 0 4px var(--c, #ff80c0));
  }
  @keyframes driftUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-120px) scale(1.1) rotate(30deg); }
  }

  /* ── phone wrapper ── */
  #phone-wrap {
    position: relative;
    z-index: 2;
    width: 360px;
    filter: drop-shadow(0 0 30px rgba(255,100,180,0.5)) drop-shadow(0 20px 40px rgba(200,50,150,0.3));
  }

  #phone-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* Phone body */
  #_x3C_background_x3E_ {
    fill: url(#bodyGrad);
    stroke: #e060b0;
    stroke-width: 2;
    filter: url(#bevel);
  }

  /* Screen */
  #phone_screen {
    fill: url(#screenGrad);
    stroke: #ff90d0;
    stroke-width: 2;
  }

  /* Phone decoration arc */
  #phone_decoration {
    fill: none;
    stroke: url(#arcGrad);
    stroke-width: 3;
  }

  /* ── WINGS ── */
  #left_wing {
    fill: url(#wingGradL);
    stroke: #ffaad8;
    stroke-width: 1.5;
    transform-origin: 250px 342px;
    transition: transform 0.75s cubic-bezier(.34,1.56,.64,1), opacity 0.5s;
    opacity: 0;
    transform: rotate(0deg) scale(0);
    filter: url(#wingGlow);
    pointer-events: none;
  }
  #right_wing {
    fill: url(#wingGradR);
    stroke: #ffaad8;
    stroke-width: 1.5;
    transform-origin: 250px 342px;
    transition: transform 0.75s cubic-bezier(.34,1.56,.64,1), opacity 0.5s;
    opacity: 0;
    transform: rotate(0deg) scale(0);
    filter: url(#wingGlow);
    pointer-events: none;
  }
  #left_wing.active  { opacity: 1; transform: rotate(-18deg) scale(1); }
  #right_wing.active { opacity: 1; transform: rotate(18deg)  scale(1); }

  /* wing glitter overlays */
  #left_wing_glitter, #right_wing_glitter {
    pointer-events: none;
    transition: opacity 0.5s;
    opacity: 0;
  }
  #left_wing_glitter.active, #right_wing_glitter.active { opacity: 0.7; }

  /* ── Wing buttons ── */
  #left_wing_button, #right_wing_button {
    fill: url(#wingBtnGrad);
    stroke: #ff60b0;
    stroke-width: 1.5;
    cursor: pointer;
    transition: filter 0.15s;
    filter: url(#btnGlow);
  }
  #left_wing_button:hover  { filter: url(#btnGlowHot); }
  #right_wing_button:hover { filter: url(#btnGlowHot); }
  #left_wing_button.toggled, #right_wing_button.toggled {
    fill: url(#wingBtnActive);
    filter: url(#btnGlowHot);
  }

  /* D-pad arrows */
  #up_arrow, #down_arrow, #left_arrow, #right_arrow {
    fill: none;
    stroke: #ff5aaa;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* Number button ovals */
  .st2 {
    fill: url(#btnOvalGrad);
    stroke: #ffaadd;
    stroke-width: 0.5;
    cursor: pointer;
    transition: filter 0.12s;
    filter: url(#btnGlow);
  }
  .st2:hover  { filter: url(#btnGlowHot); }
  .st2:active { filter: brightness(0.88); }

  /* Number labels */
  .st4 {
    fill: #cc2080;
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    stroke: #ffe0f0;
    stroke-width: 0.3;
    pointer-events: none;
  }

  /* ── screen content ── */
  #screen-content {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 97px;
    width: 123px;
    height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  #screen-text {
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: #ffccee;
    text-shadow: 0 0 8px #ff60b0, 0 0 16px #ff60b0;
    text-align: center;
    line-height: 1.25;
    max-width: 108px;
    word-break: break-all;
  }
  #screen-signal {
    font-size: 10px;
    color: #ff90cc;
    font-family: 'VT323', monospace;
    margin-top: 8px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #ff60b0;
  }

  /* ── ripple ── */
  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    animation: rippleOut 0.65s ease-out forwards;
    background: radial-gradient(circle, rgba(255,150,210,0.75) 0%, rgba(255,200,240,0.3) 60%, transparent 100%);
  }
  @keyframes rippleOut {
    from { transform: scale(0); opacity: 1; }
    to   { transform: scale(5); opacity: 0; }
  }

  /* ── fairy dust burst on wing toggle ── */
  .fairy-burst {
    position: fixed;
    pointer-events: none;
    z-index: 998;
    font-size: 18px;
    animation: fairyBurst 0.9s ease-out forwards;
  }
  @keyframes fairyBurst {
    0%   { opacity: 1; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0; transform: translate(var(--tx,0px), var(--ty,-60px)) scale(1.5) rotate(45deg); }
  }

  /* ── tagline ── */
  .tagline {
    position: relative;
    z-index: 2;
    margin-top: 10px;
    font-family: 'Fredoka One', cursive;
    font-size: 17px;
    color: #cc2080;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(255,100,180,0.6), 0 2px 6px rgba(200,50,130,0.3);
  }
  .tagline span { color: #ff80c0; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="phone-wrap">
  <div id="screen-content">
    <div id="screen-text">✦ fairy ✦</div>
    <div id="screen-signal">♡♡♡♡ NET</div>
  </div>

  <svg id="phone-svg" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Body gradient: deep pink → hot pink → blush -->
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#ffb8e8"/>
        <stop offset="25%"  stop-color="#ff85cc"/>
        <stop offset="55%"  stop-color="#ff60b8"/>
        <stop offset="80%"  stop-color="#ff85cc"/>
        <stop offset="100%" stop-color="#ffb0e0"/>
      </linearGradient>

      <!-- Screen gradient: deep magenta LCD -->
      <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#2a0020"/>
        <stop offset="100%" stop-color="#150010"/>
      </linearGradient>

      <!-- Arc gradient -->
      <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#ff40a0"/>
        <stop offset="50%"  stop-color="#ffc0e8"/>
        <stop offset="100%" stop-color="#ff40a0"/>
      </linearGradient>

      <!-- Left wing gradient: iridescent pink-to-lavender -->
      <linearGradient id="wingGradL" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#ffd0f0" stop-opacity="0.95"/>
        <stop offset="30%"  stop-color="#ffb0e8" stop-opacity="0.92"/>
        <stop offset="60%"  stop-color="#f0a0ff" stop-opacity="0.88"/>
        <stop offset="100%" stop-color="#ffccf5" stop-opacity="0.90"/>
      </linearGradient>

      <!-- Right wing gradient -->
      <linearGradient id="wingGradR" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#ffd0f0" stop-opacity="0.95"/>
        <stop offset="30%"  stop-color="#ffb0e8" stop-opacity="0.92"/>
        <stop offset="60%"  stop-color="#f0a0ff" stop-opacity="0.88"/>
        <stop offset="100%" stop-color="#ffccf5" stop-opacity="0.90"/>
      </linearGradient>

      <!-- Wing button gradient -->
      <linearGradient id="wingBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#ffe0f5"/>
        <stop offset="50%"  stop-color="#ff70c0"/>
        <stop offset="100%" stop-color="#cc2080"/>
      </linearGradient>
      <!-- Wing button active gradient -->
      <linearGradient id="wingBtnActive" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#fff0b0"/>
        <stop offset="50%"  stop-color="#ffcc00"/>
        <stop offset="100%" stop-color="#ff8000"/>
      </linearGradient>

      <!-- Button oval gradient -->
      <linearGradient id="btnOvalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.98"/>
        <stop offset="30%"  stop-color="#ffd8f0"/>
        <stop offset="70%"  stop-color="#ffaadd"/>
        <stop offset="100%" stop-color="#ff80cc"/>
      </linearGradient>

      <!-- Bevel filter for body -->
      <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
        <feOffset dx="-4" dy="-4" in="blur" result="ob1"/>
        <feOffset dx="4"  dy="4"  in="blur" result="ob2"/>
        <feFlood flood-color="white"   flood-opacity="0.65" result="white"/>
        <feFlood flood-color="#a01060" flood-opacity="0.45" result="dark"/>
        <feComposite in="white" in2="ob1" operator="in" result="hi"/>
        <feComposite in="dark"  in2="ob2" operator="in" result="sh"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="hi"/>
          <feMergeNode in="sh"/>
        </feMerge>
      </filter>

      <!-- Soft button glow -->
      <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Hot glow (hover/active) -->
      <filter id="btnGlowHot" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values="1.5 0 0.5 0 0  0 0 0.5 0 0  0.5 0 1 0 0  0 0 0 1.8 0" result="colored"/>
        <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Wing glow filter -->
      <filter id="wingGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
        <feColorMatrix in="blur" type="matrix"
          values="1.2 0 0.3 0 0.1  0 0.3 0.8 0 0  0.5 0 0.8 0 0.1  0 0 0 0.85 0" result="tinted"/>
        <feMerge><feMergeNode in="tinted"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Glitter sparkle pattern for wings -->
      <pattern id="glitter" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect width="18" height="18" fill="none"/>
        <circle cx="2"  cy="2"  r="1"   fill="white"   opacity="0.8"/>
        <circle cx="9"  cy="5"  r="0.6" fill="#ffe0f8" opacity="0.9"/>
        <circle cx="15" cy="1"  r="0.8" fill="white"   opacity="0.7"/>
        <circle cx="5"  cy="12" r="0.5" fill="#ffccee" opacity="0.85"/>
        <circle cx="13" cy="14" r="0.9" fill="white"   opacity="0.8"/>
        <circle cx="1"  cy="16" r="0.6" fill="#f8d0ff" opacity="0.75"/>
        <circle cx="17" cy="10" r="0.7" fill="white"   opacity="0.7"/>
        <circle cx="8"  cy="16" r="0.5" fill="#ffc0f0" opacity="0.9"/>
      </pattern>
    </defs>

<div class="tagline">✦ fairy <span>phone</span> ✦</div>

<script>
// ── Glitter star field ──
(function() {
  const c = document.getElementById('stars');
  const pink  = ['#ff60b0','#ff90cc','#ffb3dc','#ffd6f0','#ffffff','#f8b0ff','#ffc0e8'];
  const chars = ['✦','✧','★','✺','◆','♡','·'];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left:${Math.random()*100}vw; top:${Math.random()*100}vh;
      --sz:${(Math.random()*12+6)}px;
      --c:${pink[Math.floor(Math.random()*pink.length)]};
      --dur:${(Math.random()*3+1.2).toFixed(1)}s;
      --delay:-${(Math.random()*5).toFixed(1)}s;
    `;
    c.appendChild(s);
  }
  // drifting particles
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'drift';
    d.textContent = chars[Math.floor(Math.random()*chars.length)];
    d.style.cssText = `
      left:${Math.random()*100}vw; top:${(Math.random()*80+20)}vh;
      --sz:${(Math.random()*10+5)}px;
      --c:${pink[Math.floor(Math.random()*pink.length)]};
      --dur:${(Math.random()*5+4).toFixed(1)}s;
      --delay:-${(Math.random()*8).toFixed(1)}s;
    `;
    c.appendChild(d);
  }
})();

// ── Wing toggle state ──
const leftWing     = document.getElementById('left_wing');
const rightWing    = document.getElementById('right_wing');
const leftGlitter  = document.getElementById('left_wing_glitter');
const rightGlitter = document.getElementById('right_wing_glitter');
const leftWingBtn  = document.getElementById('left_wing_button');
const rightWingBtn = document.getElementById('right_wing_button');
const screenText   = document.getElementById('screen-text');
const screenSignal = document.getElementById('screen-signal');

let leftOn  = false;
let rightOn = false;

const fairyTexts = {
  left:  ['✦ wings ✦', '♡ fly ♡', '✧ magic ✧', 'fairy! ✦'],
  right: ['✦ soar ✦',  '♡ shine ♡','✧ dream ✧',  'glitter!'],
  num:   ['✦ beep ✦',  '♡ boop ♡', '✧ pip ✧',    'zap! ✦'],
};
const signals = ['♡♡♡♡ NET','♡♡♡░ FAE','♡♡░░ PKY','♡░░░ MGC'];
let sigIdx = 0;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function setScreen(msg) {
  screenText.textContent = msg;
  sigIdx = (sigIdx + 1) % signals.length;
  screenSignal.textContent = signals[sigIdx];
}

function fairyBurst(x, y) {
  const chars = ['✦','✧','★','♡','✺','·'];
  const colors = ['#ff60b0','#ffaadd','#ff90cc','#ffd6f0','#f8b0ff'];
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    el.className = 'fairy-burst';
    el.textContent = chars[Math.floor(Math.random()*chars.length)];
    const angle = (Math.random() * 360) * Math.PI / 180;
    const dist  = 30 + Math.random() * 50;
    el.style.cssText = `
      left:${x}px; top:${y}px;
      color:${colors[Math.floor(Math.random()*colors.length)]};
      font-size:${10+Math.random()*14}px;
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist - 40}px;
      animation-delay:${Math.random()*0.15}s;
      filter: drop-shadow(0 0 4px currentColor);
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function spawnRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  const sz = 60;
  r.style.cssText = `left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;`;
  document.body.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

// ── Left wing button toggle ──
leftWingBtn.addEventListener('click', () => {
  leftOn = !leftOn;
  leftWing.classList.toggle('active', leftOn);
  leftGlitter.classList.toggle('active', leftOn);
  leftWingBtn.classList.toggle('toggled', leftOn);
  const rect = leftWingBtn.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  spawnRipple(cx, cy);
  fairyBurst(cx, cy);
  setScreen(leftOn ? pick(fairyTexts.left) : '✦ fairy ✦');
});

// ── Right wing button toggle ──
rightWingBtn.addEventListener('click', () => {
  rightOn = !rightOn;
  rightWing.classList.toggle('active', rightOn);
  rightGlitter.classList.toggle('active', rightOn);
  rightWingBtn.classList.toggle('toggled', rightOn);
  const rect = rightWingBtn.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  spawnRipple(cx, cy);
  fairyBurst(cx, cy);
  setScreen(rightOn ? pick(fairyTexts.right) : '✦ fairy ✦');
});

// ── Number buttons ──
document.querySelectorAll('.numpad-btn').forEach(el => {
  el.addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    spawnRipple(cx, cy);
    fairyBurst(cx, cy);
    setScreen(pick(fairyTexts.num));
  });
});

// touch support for wing buttons
[leftWingBtn, rightWingBtn].forEach(btn => {
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    btn.dispatchEvent(new MouseEvent('click'));
  }, { passive: false });
});
</script>
