<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fairy Phone ✦</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Fredoka+One&display=swap" rel="stylesheet" />
<style>
  /* Base Reset & Fairy Background */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 25% 15%, #ffc0e8 0%, #ffaade 30%, #f8d0ff 60%, #ffd6f5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    overflow: hidden;
    position: relative;
  }

  /* Floating Sparkle Canvas */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    animation: twinkle var(--dur, 2s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }
  .star::before {
    content: '✦';
    font-size: var(--sz, 12px);
    color: var(--c, #ffb3dc);
    display: block;
    filter: drop-shadow(0 0 4px var(--c, #ffb3dc));
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1.3) rotate(20deg); }
  }

  /* Main Device Wrapper */
  #phone-container {
    position: relative;
    width: 600px;
    height: 800px;
    z-index: 2;
    filter: drop-shadow(0 10px 30px rgba(255, 120, 180, 0.4));
  }

  /* Wing Positioning (Straighter Sideways Movement) */
  .wing-graphic {
    position: absolute;
    top: 22%;
    width: 240px;
    height: auto;
    pointer-events: none;
    opacity: 0;
    z-index: 1;
    transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
  }
  #wing-left {
    right: 70%;
    transform: translateX(80px) scaleX(-1); /* Flipped and tucked behind */
  }
  #wing-right {
    left: 70%;
    transform: translateX(-80px); /* Tucked behind */
  }

  /* Triggered Side Wing States */
  #wing-left.active {
    opacity: 1;
    transform: translateX(-60px) scaleX(-1) scale(1.15);
  }
  #wing-right.active {
    opacity: 1;
    transform: translateX(60px) scale(1.15);
  }

  /* Main Interactive Device Frame */
  #phone-layout-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
  }

  /* Embedded Dynamic Digital Screen */
  #screen-overlay {
    position: absolute;
    left: 23.5%;
    top: 13.5%;
    width: 53%;
    height: 31%;
    z-index: 4;
    border-radius: 24px;
    overflow: hidden;
    border: 3px solid #ff9cd3;
    background: #000;
    box-shadow: inset 0 0 20px rgba(255,192,203,0.5);
  }

  .screen-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.45;
    mix-blend-mode: luminosity;
  }

  .screen-gif {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 65px;
    height: 65px;
    object-fit: contain;
    z-index: 5;
    filter: drop-shadow(0 0 4px #ffb3dc);
  }

  .screen-content {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 6;
  }

  .screen-header {
    display: flex;
    justify-content: space-between;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #ffb8e3;
    text-shadow: 0 0 5px #ff4fa8;
  }

  .screen-display-text {
    font-family: 'VT323', monospace;
    font-size: 26px;
    color: #00f3ff;
    text-shadow: 0 0 8px rgba(0,243,255,0.8), 0 0 2px #fff;
    max-width: 80%;
    line-height: 1.2;
    word-wrap: break-word;
  }

  /* SVG
